<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liberty Tool Company — For Installers. By Installers.</title>
<meta name="description" content="Coating systems and jobsite tools for installers, dealers and enterprise crews. Veteran-owned, family-operated, made in the USA.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo-blue.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2F5FF;color:#071A52;font-family:Inter,system-ui,sans-serif}
a{color:#0A35C8}a:hover{color:#B31942}
html{scroll-behavior:smooth}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #B31942;outline-offset:2px}
input[type=range]{accent-color:#B31942}
@keyframes ltcRide{0%{width:0}8%{width:0}78%{width:70%}100%{width:70%}}
@keyframes ltcRoll{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ltcPop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ltc2Marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes ltc2Spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ltc2-marq{animation:ltc2Marq 38s linear infinite}
.ltc2-spin{animation:ltc2Spin 22s linear infinite}
@keyframes ltcFade{from{opacity:0}to{opacity:1}}
.ltc-wheel{transform-box:fill-box;transform-origin:center;animation:ltcRoll .7s linear infinite}
@media (max-width: 640px){.ltc-tile{font-size:8px !important;border-radius:3px !important}}
@media (prefers-reduced-motion: reduce){.ltc-anim,.ltc-wheel,.ltc2-marq,.ltc2-spin{animation:none !important}html{scroll-behavior:auto}}
</style>

</head>

<template id="tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #071A52; background: #F2F5FF; min-width: 0">
