<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTC Sales Rep Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo-blue.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2F5FF;color:#071A52;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#0A35C8}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #B31942;outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:#0A35C8;color:#FFFFFF;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.35) transparent}
.sidemore{position:fixed;left:0;bottom:0;width:248px;box-sizing:border-box;z-index:30;margin:0;padding:34px 16px 16px;background:linear-gradient(to bottom,rgba(10,53,200,0),#0A35C8 45%);display:flex;justify-content:center;pointer-events:none}
.sidemore button{pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;border:2px solid #FFFFFF;background:#FFFFFF;color:#0A35C8;font-weight:800;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;box-shadow:0 8px 22px rgba(4,16,60,0.55),0 0 0 4px rgba(255,255,255,0.18)}
.sidemore button:hover{background:#FFE7EC;color:#B31942;border-color:#FFE7EC}
.sidemore button:focus-visible{outline:3px solid #FFD54A;outline-offset:2px}
.linkbtn{border:0;background:none;padding:0;margin-top:4px;color:#0A35C8;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:underline;text-underline-offset:2px}
.drop{border:2px dashed #C9D4F2;border-radius:12px;padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#FFFFFF}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.lblrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #DCE3F7;font-size:14px}
.lblrow:last-child{border-bottom:0}
.lbic{width:34px;height:34px;border-radius:6px;background:#FFFFFF;border:1px solid #DCE3F7;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#0A35C8}
.csov{position:fixed;inset:0;z-index:70;background:rgba(7,18,40,0.62);display:flex;justify-content:center;align-items:flex-start;padding:0 16px;overflow-y:auto}
.cspanel{width:100%;max-width:900px;margin:28px 0;background:#F2F5FF;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,0.35)}
.cstop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #DCE3F7;position:sticky;top:0;background:#F2F5FF;border-radius:20px 20px 0 0;z-index:1}
.cssheet{background:#FFFFFF;margin:18px;border:1px solid #DCE3F7;color:#1E2633;font-size:14px;line-height:1.5}
.cshead{background:#0A35C8;color:#FFFFFF;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 26px;flex-wrap:wrap}
.cshead img{height:46px;width:auto;display:block}
.csbody{padding:26px}
.csgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:start}
@media (max-width:700px){.csgrid{grid-template-columns:1fr}.csbody{padding:18px}.cssheet{margin:10px}}
.csimg{background:#E8EEFF;border-radius:12px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.csimg img{width:86%;height:86%;object-fit:contain}
.csname{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;font-size:34px;line-height:1;color:#071A52;margin-top:6px}
.csfeat{margin:12px 0 0;padding:0;list-style:none}
.csfeat li{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #DCE3F7}
.csfeat li:before{content:"✓";color:#B31942;font-weight:800}
.csprice{display:flex;align-items:baseline;gap:8px;margin-top:14px;padding:12px 14px;background:#E8EEFF;border-radius:12px}
.csspec{display:grid;grid-template-columns:150px minmax(0,1fr);border-top:2px solid #0A35C8;margin-top:22px;font-size:13px}
.csspec span{padding:7px 8px;border-bottom:1px solid #DCE3F7}
.csspec span:nth-child(odd){font-weight:700;color:#4A5578;background:#FAFBFD}
.cstbd{color:#8A5A00;font-style:italic}
.csfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:14px 26px;border-top:1px solid #DCE3F7;font-size:12px;color:#4A5578}
.lcgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:10px}
@media (max-width:700px){.lcgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lctile{border:1px solid #DCE3F7;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.lctile .csimg{aspect-ratio:4/3}
.lcsec{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;font-size:18px;color:#0A35C8;margin-top:18px;padding-bottom:4px;border-bottom:2px solid #B31942}
@media print{body *{visibility:hidden !important}.csov,.csov .cssheet,.csov .cssheet *{visibility:visible !important}.csov{position:absolute;background:none;padding:0;overflow:visible}.cspanel{box-shadow:none;background:none;margin:0}.cstop{display:none}.cssheet{margin:0;border:0}.cshead,.csprice,.csimg,.csspec span{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.script{font-family:'Dancing Script',cursive;font-weight:700;font-size:34px;color:#071A52;line-height:1}
.pthumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#E8EEFF;border:1px solid #DCE3F7;display:block}
.pimg{aspect-ratio:1/1;border-radius:12px;background:#E8EEFF;border:1px solid #DCE3F7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:contain}
.diff{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #DCE3F7}
.diff:last-child{border-bottom:0}
.sigbox{border:1.5px dashed #C9D4F2;border-radius:12px;background:#FFFFFF;min-height:76px;display:flex;align-items:flex-end;padding:8px 14px 10px}
.side .nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#D6E0F2;padding:11px 12px;border-radius:12px;font-weight:600;font-size:15px}
.nv:hover{background:rgba(255,255,255,0.08);color:#FFFFFF}
.nv[aria-current="page"]{background:#FFFFFF;color:#0A35C8}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#B31942;color:#FFFFFF;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.main{min-width:0;padding:26px 32px 64px}
.h1{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:30px;line-height:1.05;margin:0}
.h2{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:21px;line-height:1.1;margin:0}
.h3{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:16px;line-height:1.15;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B31942}
.muted{color:#4A5578}
.card{background:#FFFFFF;border:1px solid #DCE3F7;border-radius:20px;box-shadow:0 12px 30px rgba(7,26,82,0.08);padding:20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi .n{font-family:Poppins, sans-serif;font-weight:800;font-size:34px;line-height:1;color:#0A35C8}
.kpi .l{margin-top:6px;font-size:13px;font-weight:600;color:#4A5578}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid #0A35C8;background:#0A35C8;color:#FFFFFF;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none}
.btn.red{background:#B31942;border-color:#B31942}
.btn.ghost{background:#FFFFFF;color:#0A35C8}
.btn.sm{min-height:34px;padding:0 12px;font-size:12px}
.btn[disabled]{opacity:0.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid #DCE3F7;background:#FFFFFF;font-size:13px;font-weight:600;color:#071A52}
.chip[aria-pressed="true"]{background:#0A35C8;border-color:#0A35C8;color:#FFFFFF}
.st{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#4A5578;margin-bottom:6px}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid #C9D4F2;border-radius:12px;background:#FFFFFF;font-size:15px}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical}
.tbl{font-size:14px;min-width:var(--minw)}
.tr{display:grid;grid-template-columns:var(--cols);gap:0 12px;align-items:center;padding:11px 10px;border-bottom:1px solid #DCE3F7}
.tr.th{padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#4A5578}
.tr.click{cursor:pointer}
.tr.click:hover{background:#E8EEFF}
.scroll{overflow-x:auto}
.opt{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:20px;border:1px solid #DCE3F7;background:#FFFFFF;min-height:118px}
.opt[aria-pressed="true"]{border:2px solid #0A35C8;background:#E8EEFF;padding:15px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.stp{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:#FFFFFF;border:1px solid #DCE3F7;font-weight:600;font-size:14px}
.stp .d{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#E8EEFF;color:#0A35C8;font-weight:800;font-size:13px}
.stp[aria-current="step"]{border-color:#0A35C8}
.stp[aria-current="step"] .d{background:#0A35C8;color:#FFFFFF}
.qty{display:inline-flex;align-items:center;border:1px solid #C9D4F2;border-radius:12px;overflow:hidden;background:#FFFFFF}
.qty button{width:36px;height:38px;border:0;background:#E8EEFF;font-weight:800;color:#0A35C8}
.qty input{width:62px;height:38px;border:0;text-align:center;font-weight:700}
.bub{max-width:560px;padding:12px 14px;border-radius:20px;font-size:15px;line-height:1.5}
.tl{display:flex;flex-wrap:wrap;gap:0}
.tl .s{flex:1 1 110px;min-width:110px;padding:10px 8px 0;border-top:4px solid #DCE3F7;font-size:13px}
.tl .s.done{border-top-color:#2E7D4F}
.tl .s.now{border-top-color:#0A35C8}
.toast{position:fixed;right:20px;bottom:20px;z-index:40;background:#071A52;color:#FFFFFF;padding:14px 18px;border-radius:20px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,0.25)}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#E8EEFF;display:block}
.demo{display:flex;gap:6px;background:rgba(255,255,255,0.1);padding:4px;border-radius:999px}
.demo button{flex:1;border:0;border-radius:999px;padding:7px 8px;font-size:12px;font-weight:700;background:transparent;color:#D6E0F2}
.demo button[aria-pressed="true"]{background:#FFFFFF;color:#0A35C8}
@media (max-width: 860px){.app{grid-template-columns:1fr}.side{padding:16px;position:static;height:auto;overflow:visible}.sidemore{display:none}.side .nav{flex-direction:row;flex-wrap:wrap}.nv{width:auto}.main{padding:20px 16px 56px}}

.bar{height:12px;border-radius:999px;background:#E8EEFF;overflow:hidden}
.bar>i{display:block;height:100%;background:#B31942;border-radius:999px;transition:width .3s}
.bar.blue>i{background:#0A35C8}
.big{font-family:Poppins, sans-serif;font-weight:800;line-height:1;color:#0A35C8}
.rng{width:100%;accent-color:#B31942;height:32px}
.chart{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px;align-items:end;height:180px;padding-top:10px;position:relative}
.chart .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.chart .c i{display:block;width:100%;max-width:38px;border-radius:12px 12px 0 0;background:#0A35C8}
.chart .c i.now{background:#B31942}
.chart .c span{font-size:11px;font-weight:700;color:#4A5578}
.vid{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#071A52,#0A35C8);display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.vid.doc{background:linear-gradient(135deg,#FFFFFF,#E8EEFF);color:#071A52;border:1px solid #DCE3F7}
.vt{position:absolute;left:18px;top:16px;right:18px;font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;font-size:20px;line-height:1.1}
.vlen{position:absolute;left:16px;bottom:14px;font-size:12px;font-weight:700;background:rgba(0,0,0,0.45);color:#FFFFFF;padding:3px 8px;border-radius:999px}
.play{position:relative;width:64px;height:64px;border-radius:50%;border:0;background:#B31942;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,0.2)}
.prog>i{display:block;height:100%;width:0;background:#B31942;animation:repPlay 8s linear forwards}
@keyframes repPlay{to{width:100%}}
@media (prefers-reduced-motion: reduce){.prog>i{animation:none;width:100%}}
.pg{width:96px;height:124px;background:#FFFFFF;border:1px solid #C9D4F2;border-radius:4px;box-shadow:0 8px 20px rgba(11,27,51,0.12);display:flex;flex-direction:column;gap:7px;padding:14px 12px}
.pg i{display:block;height:5px;border-radius:3px;background:#DCE3F7}
.pg i:first-child{background:#0A35C8;width:60%}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:12px;border:1px solid #DCE3F7;background:#FFFFFF}
.trow[aria-pressed="true"]{border:2px solid #0A35C8;padding:9px;background:#E8EEFF}
.ticon{width:44px;height:44px;border-radius:12px;background:#E8EEFF;color:#0A35C8;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:0.04em}
.trow[aria-pressed="true"] .ticon{background:#FFFFFF}
.tick{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:10px;font-weight:800;border:2px solid #C9D4F2;color:transparent}
.tick.on{background:#2E7D4F;border-color:#2E7D4F;color:#FFFFFF}
.news{padding:16px 0;border-bottom:1px solid #DCE3F7}
.news:last-child{border-bottom:0}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed #B31942}
</style>

</head>
<body>
<div id="ltc-preview-bar" style="position: relative; z-index: 60; background: #0B1424; color: #FFFFFF; font: 500 13px/1.2 Inter, system-ui, sans-serif">
  <div style="max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px">
    <a href="/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap">← LTC Preview Portal</a>
    <span style="opacity: 0.35">|</span>
    <nav aria-label="Preview pages" style="display: flex; flex-wrap: wrap; gap: 8px 20px"><a href="/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Website</a><a href="/approvals/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Social Posting Calendar</a><a href="/partner-portal/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Partner Portal</a><a href="/affiliate-portal/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Affiliate Portal</a><a href="/sales-rep/option-2/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; white-space: nowrap; border-bottom: 2px solid #B31942; padding-bottom: 2px">Sales Rep Portal</a><a href="/admin/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Admin</a></nav>
  </div>
</div>
<script>(function(){var h=location.hostname;var preview=/(^|\.)ltc-preview\.onrender\.com$|^localhost$|^127\.0\.0\.1$/.test(h);if(window.self!==window.top||!preview){document.getElementById('ltc-preview-bar').style.display='none';}})();</script>
<template id="tpl">

<div class="app">
  <aside class="side">
    <img src="/assets/logo-white.png" alt="Liberty Tool Company" style="height: 56px; width: auto; align-self: flex-start">
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #AFC0DC">Sales Rep Portal</div>
      <div style="margin-top: 4px; font-weight: 700; font-size: 16px; line-height: 1.3">{{me.name}}</div>
      <div style="font-size: 13px; color: #C9D6EC">{{me.type}} · {{me.territory}}</div>
    </div>
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #AFC0DC; margin-bottom: 6px">Demo: View As</div>
      <div class="demo" role="group" aria-label="Demo rep">
        <button type="button" aria-pressed="{{isActive}}" onClick="{{pickActive}}">Territory</button>
        <button type="button" aria-pressed="{{isAgency}}" onClick="{{pickAgency}}">Agency</button>
        <button type="button" aria-pressed="{{isNew}}" onClick="{{pickNew}}">New Rep</button>
      </div>
    </div>
    <nav class="nav" aria-label="Sales rep portal">
      <sc-for list="{{navs}}" as="n" hint-placeholder-count="7">
        <button type="button" class="nv" aria-current="{{n.cur}}" onClick="{{n.go}}"><span>{{n.label}}</span><sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge">{{n.badge}}</span></sc-if></button>
      </sc-for>
    </nav>
    <div style="margin-top: auto; font-size: 12px; line-height: 1.5; color: #AFC0DC">You see only the accounts LTC assigns to you. Questions? Text 239-744-8403.</div>
    <sc-if value="{{sideMore}}" hint-placeholder-val="{{false}}"><div class="sidemore"><button type="button" onClick="{{sideDown}}" aria-label="Scroll the menu down">More <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div></sc-if>
  </aside>

  <main class="main">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px">
      <div>
        <div class="eyebrow">Liberty Tool Company · Sales Team</div>
        <h1 class="h1" style="margin-top: 6px">{{title}}</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px"><span class="chip">Commission: {{me.rateTxt}}</span><button type="button" class="btn red" onClick="{{goVisit}}">+ Log A Visit</button></div>
    </div>

    <!-- ================= HOME ================= -->
    <sc-if value="{{v.home}}" hint-placeholder-val="{{true}}">
      <sc-if value="{{noGoal}}" hint-placeholder-val="{{false}}">
        <div class="card" style="border: 2px solid #B31942">
          <div class="eyebrow">Step 1 · Before You Start</div>
          <h2 class="h2" style="margin-top: 6px">Set Your Goal For The Year</h2>
          <p class="muted" style="margin: 8px 0 0; line-height: 1.55; max-width: 720px">Every rep sets one goal when they join. It shows on your dashboard so you always know where you stand. Pick sales dollars or caddies sold. You can change it later.</p>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px"><sc-for list="{{gTypes}}" as="g" hint-placeholder-count="2"><button type="button" class="chip" aria-pressed="{{g.on}}" onClick="{{g.pick}}">{{g.label}}</button></sc-for></div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 12px">
            <label style="flex: 0 1 260px"><span class="lbl">{{gLabel}}</span><input class="inp" type="number" min="1" value="{{gDraft}}" placeholder="{{gPh}}" onChange="{{setGDraft}}"></label>
            <button type="button" class="btn red" onClick="{{saveGoal}}">Set My Goal</button>
          </div>
