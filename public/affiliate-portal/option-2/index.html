<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTC Affiliate Portal — Option 2</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo-blue.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2F5FF;color:#071A52;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#0A35C8}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #B31942;outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:#0A35C8;color:#FFFFFF;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.side .nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#D6E0F2;padding:11px 12px;border-radius:12px;font-weight:600;font-size:15px}
.nv:hover{background:rgba(255,255,255,0.08);color:#FFFFFF}
.nv[aria-current="page"]{background:#FFFFFF;color:#0A35C8}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#B31942;color:#FFFFFF;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.main{min-width:0;padding:26px 32px 64px}
.h1{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:30px;line-height:1.05;margin:0}
.h2{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:21px;line-height:1.1;margin:0}
.h3{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:16px;line-height:1.15;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B31942}
.muted{color:#4A5578}
.card{background:#FFFFFF;border:1px solid #DCE3F7;border-radius:20px;box-shadow:0 12px 30px rgba(7,26,82,0.08);padding:20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi .n{font-family:Poppins, sans-serif;font-weight:800;font-size:34px;line-height:1;color:#0A35C8}
.kpi .l{margin-top:6px;font-size:13px;font-weight:600;color:#4A5578}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid #0A35C8;background:#0A35C8;color:#FFFFFF;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none}
.btn.red{background:#B31942;border-color:#B31942}
.btn.ghost{background:#FFFFFF;color:#0A35C8}
.btn.sm{min-height:34px;padding:0 12px;font-size:12px}
.btn[disabled]{opacity:0.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid #DCE3F7;background:#FFFFFF;font-size:13px;font-weight:600;color:#071A52}
.chip[aria-pressed="true"]{background:#0A35C8;border-color:#0A35C8;color:#FFFFFF}
.st{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#4A5578;margin-bottom:6px}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid #C9D4F2;border-radius:12px;background:#FFFFFF;font-size:15px}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical}
.tbl{font-size:14px;min-width:var(--minw)}
.tr{display:grid;grid-template-columns:var(--cols);gap:0 12px;align-items:center;padding:11px 10px;border-bottom:1px solid #DCE3F7}
.tr.th{padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#4A5578}
.tr.click{cursor:pointer}
.tr.click:hover{background:#E8EEFF}
.scroll{overflow-x:auto}
.opt{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:20px;border:1px solid #DCE3F7;background:#FFFFFF;min-height:118px}
.opt[aria-pressed="true"]{border:2px solid #0A35C8;background:#E8EEFF;padding:15px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.stp{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:#FFFFFF;border:1px solid #DCE3F7;font-weight:600;font-size:14px}
.stp .d{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#E8EEFF;color:#0A35C8;font-weight:800;font-size:13px}
.stp[aria-current="step"]{border-color:#0A35C8}
.stp[aria-current="step"] .d{background:#0A35C8;color:#FFFFFF}
.qty{display:inline-flex;align-items:center;border:1px solid #C9D4F2;border-radius:12px;overflow:hidden;background:#FFFFFF}
.qty button{width:36px;height:38px;border:0;background:#E8EEFF;font-weight:800;color:#0A35C8}
.qty input{width:62px;height:38px;border:0;text-align:center;font-weight:700}
.bub{max-width:560px;padding:12px 14px;border-radius:20px;font-size:15px;line-height:1.5}
.tl{display:flex;flex-wrap:wrap;gap:0}
.tl .s{flex:1 1 110px;min-width:110px;padding:10px 8px 0;border-top:4px solid #DCE3F7;font-size:13px}
.tl .s.done{border-top-color:#2E7D4F}
.tl .s.now{border-top-color:#0A35C8}
.toast{position:fixed;right:20px;bottom:20px;z-index:40;background:#071A52;color:#FFFFFF;padding:14px 18px;border-radius:20px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,0.25)}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#E8EEFF;display:block}
.demo{display:flex;gap:6px;background:rgba(255,255,255,0.1);padding:4px;border-radius:999px}
.demo button{flex:1;border:0;border-radius:999px;padding:7px 8px;font-size:12px;font-weight:700;background:transparent;color:#D6E0F2}
.demo button[aria-pressed="true"]{background:#FFFFFF;color:#0A35C8}
@media (max-width: 860px){.app{grid-template-columns:1fr}.side{padding:16px}.side .nav{flex-direction:row;flex-wrap:wrap}.nv{width:auto}.main{padding:20px 16px 56px}}

.bar{height:10px;border-radius:999px;background:#E8EEFF;overflow:hidden}
.bar>i{display:block;height:100%;background:#B31942;border-radius:999px}
.code{display:inline-flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;border:1.5px dashed #0A35C8;background:#E8EEFF;font-weight:800;letter-spacing:0.04em;color:#0A35C8;max-width:100%}
.code span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vid{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#071A52,#0A35C8);display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.vid img{position:absolute;right:6%;bottom:8%;height:62%;opacity:0.9;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.35))}
.play{position:relative;width:64px;height:64px;border-radius:50%;border:0;background:#B31942;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.vt{position:absolute;left:16px;top:14px;right:40%;font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;font-size:18px;line-height:1.1}
.vlen{position:absolute;left:16px;bottom:14px;font-size:12px;font-weight:700;background:rgba(0,0,0,0.45);padding:3px 8px;border-radius:999px}
.prog{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,0.2)}
.prog>i{display:block;height:100%;width:0;background:#B31942;animation:affPlay 8s linear forwards}
@keyframes affPlay{to{width:100%}}
.vrow{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:12px;border:1px solid #DCE3F7;background:#FFFFFF}
.vrow[aria-pressed="true"]{border:2px solid #0A35C8;padding:9px;background:#E8EEFF}
.vrow .vid{border-radius:12px}
.vrow .vid img{height:70%}
.tick{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:13px;font-weight:800;border:2px solid #C9D4F2;color:transparent}
.tick.on{background:#2E7D4F;border-color:#2E7D4F;color:#FFFFFF}
.news{padding:16px 0;border-bottom:1px solid #DCE3F7}
.news:last-child{border-bottom:0}
@media (prefers-reduced-motion: reduce){.prog>i{animation:none;width:100%}}
</style>

</head>
<body>
<div id="ltc-preview-bar" style="position: relative; z-index: 60; background: #0B1424; color: #FFFFFF; font: 500 13px/1.2 Inter, system-ui, sans-serif">
  <div style="max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px">
    <a href="/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap">← LTC Preview Portal</a>
    <span style="opacity: 0.35">|</span>
    <nav aria-label="Preview pages" style="display: flex; flex-wrap: wrap; gap: 8px 20px"><a href="/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Option 1 · Classic</a><a href="/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Option 2 · Fun</a><a href="/approvals/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Social Posting Calendar</a><a href="/partner-portal/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Partner Portal 1</a><a href="/partner-portal/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Partner Portal 2</a><a href="/affiliate-portal/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Affiliate Portal 1</a><a href="/affiliate-portal/option-2/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; white-space: nowrap; border-bottom: 2px solid #B31942; padding-bottom: 2px">Affiliate Portal 2</a><a href="/admin/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Admin 1</a><a href="/admin/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Admin 2</a></nav>
  </div>
</div>
<script>if(window.self!==window.top){document.getElementById('ltc-preview-bar').style.display='none';}</script>
<template id="tpl">

<div class="app">
  <aside class="side">
    <img src="/assets/logo-white.png" alt="Liberty Tool Company" style="height: 56px; width: auto; align-self: flex-start">
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #AFC0DC">Affiliate Portal</div>
      <div style="margin-top: 4px; font-weight: 700; font-size: 16px; line-height: 1.3">{{me.name}}</div>
      <div style="font-size: 13px; color: #C9D6EC">{{me.handle}} · {{me.platform}}</div>
    </div>
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #AFC0DC; margin-bottom: 6px">Demo: View As</div>
      <div class="demo" role="group" aria-label="Demo affiliate">
        <button type="button" aria-pressed="{{isActiveDemo}}" onClick="{{pickActive}}">Active</button>
        <button type="button" aria-pressed="{{isNewDemo}}" onClick="{{pickNew}}">New Affiliate</button>
      </div>
    </div>
    <nav class="nav" aria-label="Affiliate portal">
      <sc-for list="{{navs}}" as="n" hint-placeholder-count="7">
        <button type="button" class="nv" aria-current="{{n.cur}}" onClick="{{n.go}}"><span>{{n.label}}</span><sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge">{{n.badge}}</span></sc-if></button>
      </sc-for>
    </nav>
    <div style="margin-top: auto; font-size: 12px; line-height: 1.5; color: #AFC0DC">Liberty Ambassador Program · Questions? Text 239-744-8403</div>
  </aside>

  <main class="main">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px">
      <div>
        <div class="eyebrow">Liberty Ambassador Program</div>
        <h1 class="h1" style="margin-top: 6px">{{title}}</h1>
      </div>
      <div class="code" title="Your affiliate code"><span>Code: {{me.codeTxt}}</span><button type="button" class="btn sm" onClick="{{copyCode}}">Copy</button></div>
    </div>

    <!-- ================= HOME ================= -->
    <sc-if value="{{v.home}}" hint-placeholder-val="{{true}}">
      <div class="card" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; background: #E8EEFF">
        <div style="min-width: 0; flex: 1 1 360px">
          <h2 class="h2">Welcome Back, {{me.first}}.</h2>
          <div class="muted" style="margin-top: 6px; line-height: 1.5">You earn <b>$10 for every eligible caddy</b> your link sells. Paid monthly. Link straight to thetapecaddy.com, never Amazon.</div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" class="btn" onClick="{{goLinks}}">Get My Link</button>
          <button type="button" class="btn red" onClick="{{goCampaigns}}">See Live Campaigns</button>
        </div>
      </div>

      <sc-if value="{{needsOnboard}}" hint-placeholder-val="{{false}}">
        <div class="card" style="margin-top: 16px; border: 2px solid #B31942">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center">
            <div><div class="eyebrow">Getting Started</div><h2 class="h2" style="margin-top: 4px">Finish Your Onboarding</h2></div>
            <div style="min-width: 220px; flex: 0 1 300px"><div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span>{{onPct}}% done</span><span class="muted">{{onLeft}} left</span></div><div class="bar" style="margin-top: 6px"><i style="width: {{onPct}}%"></i></div></div>
          </div>
          <div class="grid g3" style="margin-top: 14px; gap: 10px">
            <sc-for list="{{onSteps}}" as="o" hint-placeholder-count="5">
              <button type="button" onClick="{{o.go}}" style="display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid #DCE3F7; background: #FFFFFF">
                <span class="tick {{o.cls}}">✓</span><span><b style="display: block">{{o.t}}</b><span class="muted" style="font-size: 13px">{{o.d}}</span></span>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <div class="grid g4" style="margin-top: 16px">
        <sc-for list="{{kpis}}" as="k" hint-placeholder-count="4"><div class="card kpi"><div class="n">{{k.n}}</div><div class="l">{{k.l}}</div></div></sc-for>
      </div>

      <div class="grid g2" style="margin-top: 16px; align-items: start">
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><h3 class="h3">Live Campaigns</h3><button type="button" class="btn ghost sm" onClick="{{goCampaigns}}">All Campaigns</button></div>
          <sc-for list="{{liveCamps}}" as="c" hint-placeholder-count="2">
            <div style="margin-top: 12px; padding: 14px; border-radius: 12px; background: #E8EEFF">
              <div style="display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap"><b>{{c.title}}</b><span class="st" style="background: #E3F3EA; color: #2E7D4F">Ends {{c.end}}</span></div>
              <div style="font-size: 14px; margin-top: 6px; color: #B31942; font-weight: 700">{{c.bonus}}</div>
            </div>
          </sc-for>
          <h3 class="h3" style="margin-top: 20px">Current Deals</h3>
          <sc-for list="{{dealsTop}}" as="d" hint-placeholder-count="2">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #DCE3F7; font-size: 14px"><span><b>{{d.title}}</b><span class="muted"> · ends {{d.ends}}</span></span><button type="button" class="btn ghost sm" onClick="{{d.copy}}">Copy Share Text</button></div>
          </sc-for>
        </div>
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><h3 class="h3">News</h3><button type="button" class="btn ghost sm" onClick="{{goNews}}">All News</button></div>
          <sc-for list="{{newsTop}}" as="n" hint-placeholder-count="3">
            <div class="news"><div style="font-size: 12px; font-weight: 700" class="muted">{{n.tag}} · {{n.date}}</div><div style="font-weight: 700; margin-top: 4px">{{n.title}}</div><div class="muted" style="font-size: 14px; margin-top: 4px; line-height: 1.5">{{n.body}}</div></div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <!-- ================= CAMPAIGNS ================= -->
    <sc-if value="{{v.campaigns}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px"><sc-for list="{{campFilters}}" as="f" hint-placeholder-count="3"><button type="button" class="chip" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
      <div class="grid g2" style="align-items: start">
        <sc-for list="{{camps}}" as="c" hint-placeholder-count="3">
          <div class="card" style="display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center"><span class="st" style="background: {{c.sbg}}; color: {{c.sfg}}">{{c.status}}</span><span class="muted" style="font-size: 13px; font-weight: 600">{{c.start}} – {{c.end}}</span></div>
            <h2 class="h2">{{c.title}}</h2>
            <p style="margin: 0; line-height: 1.55">{{c.brief}}</p>
            <div style="padding: 10px 12px; border-radius: 12px; background: #FDECEF; color: #B31942; font-weight: 700; font-size: 14px">{{c.bonus}}</div>
            <div><span class="lbl">What To Post</span><sc-for list="{{c.deliverables}}" as="x" hint-placeholder-count="3"><div style="font-size: 14px; padding: 3px 0">• {{x}}</div></sc-for></div>
            <sc-if value="{{c.hasCaption}}" hint-placeholder-val="{{true}}"><div style="padding: 12px; border-radius: 12px; background: #E8EEFF; font-size: 14px; line-height: 1.5"><span class="lbl">Starter Caption</span>{{c.caption}}</div></sc-if>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px">
              <button type="button" class="btn {{c.joinCls}}" onClick="{{c.join}}">{{c.joinLabel}}</button>
              <sc-if value="{{c.hasCaption}}" hint-placeholder-val="{{true}}"><button type="button" class="btn ghost" onClick="{{c.copy}}">Copy Caption + Link</button></sc-if>
            </div>
            <div class="muted" style="font-size: 12px">{{c.count}} affiliates joined</div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{noCamps}}" hint-placeholder-val="{{false}}"><p class="muted">No campaigns here right now.</p></sc-if>
    </sc-if>

    <!-- ================= DEALS ================= -->
    <sc-if value="{{v.deals}}" hint-placeholder-val="{{false}}">
      <div class="grid g3" style="align-items: start">
        <sc-for list="{{deals}}" as="d" hint-placeholder-count="3">
          <div class="card" style="display: flex; flex-direction: column; gap: 10px">
            <div class="h1" style="color: #B31942; font-size: 34px">{{d.off}}</div>
            <h3 class="h3">{{d.title}}</h3>
            <p class="muted" style="margin: 0; font-size: 14px; line-height: 1.5">{{d.desc}}</p>
            <div class="code"><span>{{d.codeTxt}}</span><button type="button" class="btn sm" onClick="{{d.copyCode}}">Copy Code</button></div>
            <div style="font-size: 13px; font-weight: 700">Ends {{d.ends}}</div>
            <button type="button" class="btn ghost" onClick="{{d.copy}}">Copy Share Text</button>
          </div>
        </sc-for>
      </div>
      <p class="muted" style="font-size: 13px; margin: 14px 0 0">Share codes with your link so the sale is credited to you. Deals can't be posted on Amazon or resale sites.</p>
    </sc-if>

    <!-- ================= NEWS ================= -->
    <sc-if value="{{v.news}}" hint-placeholder-val="{{false}}">
      <div class="card" style="max-width: 860px">
        <sc-for list="{{newsAll}}" as="n" hint-placeholder-count="4">
          <article class="news">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><span class="st" style="background: #E8EEFF; color: #0A35C8">{{n.tag}}</span><sc-if value="{{n.pinned}}" hint-placeholder-val="{{false}}"><span class="st" style="background: #FDECEF; color: #B31942">Pinned</span></sc-if><span class="muted" style="font-size: 13px">{{n.date}}</span></div>
            <h2 class="h2" style="margin-top: 8px">{{n.title}}</h2>
            <p style="margin: 6px 0 0; line-height: 1.6">{{n.body}}</p>
          </article>
        </sc-for>
      </div>
    </sc-if>

    <!-- ================= VIDEOS ================= -->
    <sc-if value="{{v.videos}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px"><sc-for list="{{vcats}}" as="f" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start">
