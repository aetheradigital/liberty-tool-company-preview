<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTC — Social Posting Calendar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo-blue.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F5F7;color:#0B1B33;font-family:Inter,system-ui,sans-serif}
a{color:#0A3161}a:hover{color:#B31942}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #B31942;outline-offset:2px}
@keyframes gtmFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

</head>
<body>
<div id="ltc-preview-bar" style="position: relative; z-index: 60; background: #0B1424; color: #FFFFFF; font: 500 13px/1.2 Inter, system-ui, sans-serif">
  <div style="max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px">
    <a href="/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap">← LTC Preview Portal</a>
    <span style="opacity: 0.35">|</span>
    <nav aria-label="Preview pages" style="display: flex; flex-wrap: wrap; gap: 8px 20px"><a href="/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Option 1 · Classic</a><a href="/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Option 2 · Fun</a><a href="/approvals/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; white-space: nowrap; border-bottom: 2px solid #B31942; padding-bottom: 2px">Social Posting Calendar</a><a href="/partner-portal/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Partner Portal 1</a><a href="/partner-portal/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Partner Portal 2</a><a href="/affiliate-portal/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Affiliate Portal 1</a><a href="/affiliate-portal/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Affiliate Portal 2</a><a href="/admin/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Admin 1</a><a href="/admin/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Admin 2</a></nav>
  </div>
</div>
<script>if(window.self!==window.top){document.getElementById('ltc-preview-bar').style.display='none';}</script>
<template id="tpl">

<div style="font-family: Inter, system-ui, sans-serif; color: #0B1B33; background: #F4F5F7; min-width: 0">

<!-- HEADER -->
<header style="background: #0A3161; color: #FFFFFF">
  <div style="height: 8px; background: repeating-linear-gradient(90deg, #B31942 0 40px, #FFFFFF 40px 80px)"></div>
  <div style="max-width: 1320px; margin: 0 auto; padding: 28px 24px 30px; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; min-width: 0">
      <img src="/assets/logo-white.png" alt="Liberty Tool Company" style="height: 64px; width: auto; display: block">
      <div style="min-width: 0">
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: #C3CFE0">The Package · Funnels</div>
        <h1 style="margin: 2px 0 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(32px, 3.6vw, 46px); line-height: 1; text-transform: uppercase">Go-To-Market Social · Posting Calendar</h1>
        <div style="margin-top: 6px; font-size: 15px; color: #D4DDEA">Nov 2, 2026 – Jan 1, 2027 · {{stats.total}} posts · 9 campaigns</div>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #C3CFE0; min-width: 240px">Posted By
      <input type="text" placeholder="Your name" onChange="{{onReviewer}}" autocomplete="name" style="height: 46px; padding: 0 14px; border: 0; border-radius: 4px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #0B1B33; background: #FFFFFF">
    </label>
  </div>
</header>

<!-- STATS -->
<section style="max-width: 1320px; margin: 0 auto; padding: 28px 24px 0">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
    <sc-for list="{{stats.tiles}}" as="t" hint-placeholder-count="4">
      <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="text-align: left; background: #FFFFFF; border: 2px solid {{t.ring}}; border-left: 8px solid {{t.color}}; border-radius: 6px; padding: 16px 18px; cursor: pointer; color: #0B1B33">
        <span style="display: block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; color: {{t.color}}">{{t.n}}</span>
        <span style="display: block; margin-top: 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4A5568">{{t.label}}</span>
      </button>
    </sc-for>
  </div>
  <div style="margin-top: 14px; display: flex; align-items: center; gap: 14px">
    <div style="flex: 1; height: 14px; background: #DCE1E8; border-radius: 7px; overflow: hidden; display: flex">
      <div style="width: {{stats.pApproved}}%; background: #2E7D4F; transition: width 300ms ease"></div>
      <div style="width: {{stats.pChanges}}%; background: #D9822B; transition: width 300ms ease"></div>
    </div>
    <span style="font-size: 14px; font-weight: 700; color: #0A3161; white-space: nowrap">{{stats.pApproved}}% posted</span>
  </div>
</section>

<!-- CAMPAIGNS -->
<section style="max-width: 1320px; margin: 0 auto; padding: 28px 24px 0">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 10px">
    <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; text-transform: uppercase; color: #0A3161">Campaigns</h2>
    <span style="font-size: 14px; color: #4A5568">Tap a campaign to filter. Tap again to clear.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 12px">
    <sc-for list="{{campaigns}}" as="c" hint-placeholder-count="9">
      <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="text-align: left; background: {{c.bg}}; color: {{c.fg}}; border: 2px solid {{c.color}}; border-top: 8px solid {{c.color}}; border-radius: 6px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 150px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.05; text-transform: uppercase">{{c.name}}</span>
        <span style="font-size: 13px; line-height: 1.4; opacity: 0.9">{{c.goal}}</span>
        <span style="margin-top: auto; font-size: 12px; font-weight: 700">{{c.countLabel}} · {{c.done}} posted</span>
      </button>
    </sc-for>
  </div>
</section>

<!-- FILTER BAR -->
<section style="max-width: 1320px; margin: 0 auto; padding: 22px 24px 0">
  <div style="background: #FFFFFF; border: 1px solid #D3D9E2; border-radius: 6px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5568">Platform</span>
      <sc-for list="{{platFilters}}" as="f" hint-placeholder-count="5">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 40px; padding: 0 12px; border-radius: 20px; border: 2px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; cursor: pointer; font-size: 13px; font-weight: 700">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5568">Status</span>
      <sc-for list="{{statusFilters}}" as="f" hint-placeholder-count="4">
        <button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="min-height: 40px; padding: 0 12px; border-radius: 20px; border: 2px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; cursor: pointer; font-size: 13px; font-weight: 700">{{f.label}}</button>
      </sc-for>
    </div>
    <div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
      <span style="font-size: 14px; font-weight: 600; color: #4A5568">Showing {{shownCount}} of {{stats.total}}</span>
      <button type="button" onClick="{{approveShown}}" style="min-height: 40px; padding: 0 14px; border-radius: 4px; border: 0; background: #2E7D4F; color: #FFFFFF; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase">Mark All Shown Posted</button>
      <button type="button" onClick="{{clearFilters}}" style="min-height: 40px; padding: 0 12px; border-radius: 4px; border: 2px solid #0A3161; background: #FFFFFF; color: #0A3161; cursor: pointer; font-size: 13px; font-weight: 700">Clear Filters</button>
    </div>
  </div>
</section>

<!-- BOARD: CALENDAR + REVIEW -->
<section id="review" style="max-width: 1320px; margin: 0 auto; padding: 22px 24px 0">
  <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

    <div style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border: 1px solid #D3D9E2; border-radius: 6px; overflow: hidden">
      <div style="padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid #D3D9E2">
        <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; text-transform: uppercase; color: #0A3161">Nov 2026 – Jan 2027</h2>
        <span style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; font-weight: 600; color: #4A5568">
          <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2E7D4F"></span>Posted</span>
          <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #D9822B"></span>Needs Edits</span>
          <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF; border: 2px solid #8A94A3; box-sizing: border-box"></span>To Post</span>
        </span>
      </div>
      <div style="overflow-x: auto">
        <div style="min-width: 640px">
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: #F4F5F7; border-bottom: 1px solid #D3D9E2">
            <sc-for list="{{dows}}" as="d" hint-placeholder-count="7">
              <div style="padding: 8px 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5568">{{d}}</div>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))">
            <sc-for list="{{cal}}" as="day" hint-placeholder-count="63">
              <div style="min-height: 118px; padding: 8px; border-right: 1px solid #E6E9EE; border-bottom: 1px solid #E6E9EE; background: {{day.bg}}; display: flex; flex-direction: column; gap: 5px">
                <span style="font-size: 13px; font-weight: 700; color: {{day.numColor}}">{{day.label}}</span>
                <sc-for list="{{day.posts}}" as="p" hint-placeholder-count="1">
                  <button type="button" onClick="{{p.select}}" aria-pressed="{{p.pressed}}" title="{{p.title}}" style="text-align: left; display: flex; align-items: center; gap: 6px; width: 100%; min-height: 40px; padding: 5px 7px; border-radius: 4px; border: 2px solid {{p.ring}}; border-left: 6px solid {{p.color}}; background: {{p.bg}}; cursor: pointer; color: #0B1B33; opacity: {{p.opacity}}">
                    <span style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: {{p.dot}}; border: 2px solid {{p.dotRing}}; box-sizing: border-box"></span>
                    <span style="min-width: 0; font-size: 12px; font-weight: 600; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{p.title}}</span>
                  </button>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>

    <div style="flex: 1 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #D3D9E2; border-radius: 6px; overflow: hidden">
      <div style="background: {{sel.color}}; color: #FFFFFF; padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
        <div style="min-width: 0">
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.9">{{sel.campName}} · {{sel.dateLong}}</div>
          <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.05; text-transform: uppercase">{{sel.title}}</div>
        </div>
        <div style="display: flex; gap: 6px">
          <button type="button" onClick="{{selPrev}}" aria-label="Previous post" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; cursor: pointer; font-size: 18px; font-weight: 700">‹</button>
          <button type="button" onClick="{{selNext}}" aria-label="Next post" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: #FFFFFF; color: {{sel.color}}; cursor: pointer; font-size: 18px; font-weight: 700">›</button>
        </div>
      </div>
      <div style="padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between">
          <div role="tablist" aria-label="Preview on" style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{sel.platTabs}}" as="pt" hint-placeholder-count="3">
              <button type="button" role="tab" onClick="{{pt.pick}}" aria-selected="{{pt.pressed}}" style="min-height: 38px; padding: 0 12px; border-radius: 19px; border: 2px solid {{pt.border}}; background: {{pt.bg}}; color: {{pt.fg}}; cursor: pointer; font-size: 13px; font-weight: 700">{{pt.label}}</button>
            </sc-for>
          </div>
          <span style="background: {{sel.statusBg}}; color: {{sel.statusFg}}; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase">{{sel.statusLabel}}</span>
        </div>

        <!-- MOCK -->
        <div style="display: flex; justify-content: center; background: #EEF1F5; border-radius: 6px; padding: 18px 12px">
          <sc-if value="{{sel.isIG}}" hint-placeholder-val="{{true}}">
            <div style="width: 100%; max-width: 380px; background: #FFFFFF; border: 1px solid #DBDBDB; border-radius: 8px; overflow: hidden; animation: gtmFade 250ms ease">
              <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px">
                <span style="width: 34px; height: 34px; border-radius: 50%; background: #0A3161; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="/assets/logo-white.png" alt="" style="width: 30px; height: auto"></span>
                <span style="font-size: 14px; font-weight: 700">libertytoolcompany</span>
                <span style="margin-left: auto; font-size: 18px; font-weight: 700; color: #262626">···</span>
              </div>
              <div style="position: relative; aspect-ratio: {{sel.igRatio}}; background: {{sel.art.bg}}; overflow: hidden">
                <sc-if value="{{sel.art.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{sel.art.img}}" alt="{{sel.title}}" style="position: absolute; inset: {{sel.art.inset}}; width: {{sel.art.w}}; height: {{sel.art.h}}; object-fit: contain; display: block"></sc-if>
                <sc-if value="{{sel.art.hasHead}}" hint-placeholder-val="{{false}}">
                  <div style="position: absolute; left: 0; top: 0; max-width: 78%; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 5px">
                    <span style="width: 44px; height: 4px; background: #B31942"></span>
                    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: {{sel.art.headSize}}px; line-height: 0.95; text-transform: uppercase; color: {{sel.art.headColor}}">{{sel.art.head}}</span>
                    <span style="font-size: 13px; font-weight: 600; color: {{sel.art.subColor}}">{{sel.art.sub}}</span>
                  </div>
                </sc-if>
                <sc-if value="{{sel.art.hasLogo}}" hint-placeholder-val="{{false}}"><img src="/assets/logo-white.png" alt="" style="position: absolute; left: 18px; bottom: 16px; height: 44px; width: auto"></sc-if>
              </div>
              <div style="display: flex; gap: 14px; padding: 10px 12px 4px">
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"></path></svg>
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M22 3L11 13M22 3l-7 18-4-8-8-4z"></path></svg>
                <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2" style="margin-left: auto"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
              </div>
              <p style="margin: 0; padding: 4px 12px 14px; font-size: 14px; line-height: 1.45; color: #262626; white-space: pre-line"><strong>libertytoolcompany</strong> {{sel.caption}}</p>
            </div>
          </sc-if>
          <sc-if value="{{sel.isFB}}" hint-placeholder-val="{{false}}">
            <div style="width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #DADDE1; border-radius: 8px; overflow: hidden; animation: gtmFade 250ms ease">
              <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px">
                <span style="width: 40px; height: 40px; border-radius: 50%; background: #0A3161; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="/assets/logo-white.png" alt="" style="width: 36px; height: auto"></span>
                <span><span style="display: block; font-size: 15px; font-weight: 700; color: #050505">Liberty Tool Company</span><span style="display: block; font-size: 13px; color: #65676B">{{sel.dateShort}} · Public</span></span>
              </div>
              <p style="margin: 0; padding: 0 14px 10px; font-size: 15px; line-height: 1.45; color: #050505; white-space: pre-line">{{sel.caption}}</p>
              <div style="position: relative; aspect-ratio: 1 / 1; background: {{sel.art.bg}}; overflow: hidden">
                <sc-if value="{{sel.art.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{sel.art.img}}" alt="{{sel.title}}" style="position: absolute; inset: {{sel.art.inset}}; width: {{sel.art.w}}; height: {{sel.art.h}}; object-fit: contain; display: block"></sc-if>
                <sc-if value="{{sel.art.hasHead}}" hint-placeholder-val="{{false}}">
                  <div style="position: absolute; left: 0; top: 0; max-width: 78%; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 5px">
                    <span style="width: 44px; height: 4px; background: #B31942"></span>
                    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: {{sel.art.headSize}}px; line-height: 0.95; text-transform: uppercase; color: {{sel.art.headColor}}">{{sel.art.head}}</span>
                    <span style="font-size: 13px; font-weight: 600; color: {{sel.art.subColor}}">{{sel.art.sub}}</span>
                  </div>
                </sc-if>
                <sc-if value="{{sel.art.hasLogo}}" hint-placeholder-val="{{false}}"><img src="/assets/logo-white.png" alt="" style="position: absolute; left: 18px; bottom: 16px; height: 44px; width: auto"></sc-if>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #F0F2F5">
                <span style="min-width: 0"><span style="display: block; font-size: 12px; color: #65676B; text-transform: uppercase">thetapecaddy.com</span><span style="display: block; font-size: 15px; font-weight: 700; color: #050505">{{sel.cta}}</span></span>
                <span style="flex: none; background: #E4E6EB; color: #050505; padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: 700">Learn More</span>
              </div>
              <div style="display: flex; justify-content: space-around; padding: 8px 6px; border-top: 1px solid #DADDE1; font-size: 14px; font-weight: 600; color: #65676B"><span>Like</span><span>Comment</span><span>Share</span></div>
            </div>
          </sc-if>
          <sc-if value="{{sel.isLI}}" hint-placeholder-val="{{false}}">
            <div style="width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #E0DFDC; border-radius: 8px; overflow: hidden; animation: gtmFade 250ms ease">
              <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px">
                <span style="width: 46px; height: 46px; border-radius: 4px; background: #0A3161; display: flex; align-items: center; justify-content: center; overflow: hidden"><img src="/assets/logo-white.png" alt="" style="width: 42px; height: auto"></span>
                <span><span style="display: block; font-size: 15px; font-weight: 700; color: #000000E6">Liberty Tool Company</span><span style="display: block; font-size: 12px; color: #00000099">Building Materials · {{sel.dateShort}}</span></span>
                <span style="margin-left: auto; color: #0A66C2; font-size: 14px; font-weight: 700">+ Follow</span>
              </div>
              <p style="margin: 0; padding: 0 14px 10px; font-size: 14px; line-height: 1.5; color: #000000E6; white-space: pre-line">{{sel.caption}}</p>
              <div style="position: relative; aspect-ratio: 1 / 1; background: {{sel.art.bg}}; overflow: hidden">
