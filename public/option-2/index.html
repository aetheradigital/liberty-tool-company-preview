<style>
body{margin:0;background:#F2F5FF;color:#071A52;font-family:Inter,system-ui,sans-serif}
a{color:#0A35C8}a:hover{color:#B31942}
html{scroll-behavior:smooth;scroll-padding-top:96px}
@keyframes ltcProg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@supports (animation-timeline: scroll()){.ltc-prog{animation:ltcProg linear both;animation-timeline:scroll(root)}}
button,input,select,textarea{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #B31942;outline-offset:2px}

@keyframes ltcRide{0%{width:0}8%{width:0}78%{width:70%}100%{width:70%}}
@keyframes ltcRoll{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ltcPop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ltc2Marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes ltc2Spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.ltc2-marq{animation:ltc2Marq 38s linear infinite}
.ltc2-spin{animation:ltc2Spin 22s linear infinite}
@keyframes ltcFade{from{opacity:0}to{opacity:1}}
.ltc-wheel{transform-box:fill-box;transform-origin:center;animation:ltcRoll .7s linear infinite}
@media (max-width: 900px){.ltc-careers{display:none !important}.ltc-navcareer{display:block !important}.ltc-burger{display:flex !important}header>div:not(.ltc-prog){column-gap:12px !important;padding:10px 16px !important}header img{height:46px !important}.ltc-nav{display:none !important;order:3;width:100%;flex-direction:column;align-items:stretch !important;gap:0 !important;padding:6px 0 4px;border-top:1px solid #DCE1E8}header[data-menu="true"] .ltc-nav{display:flex !important}.ltc-nav a{padding:13px 4px;border-bottom:1px solid #EEF1F5;font-size:18px}.ltc-nav a:last-child{border-bottom:0}header[data-menu="true"] .ltc-b2{opacity:0}header[data-menu="true"] .ltc-b1{transform:translateY(5px) rotate(45deg);transform-origin:12px 7px}header[data-menu="true"] .ltc-b3{transform:translateY(-5px) rotate(-45deg);transform-origin:12px 17px}.ltc-b1,.ltc-b2,.ltc-b3{transition:transform .2s,opacity .2s}}
@media (max-width: 640px){.ltc-tile{font-size:8px !important;border-radius:3px !important}}
@media (prefers-reduced-motion: reduce){.ltc-anim,.ltc-wheel,.ltc2-marq,.ltc2-spin{animation:none !important}html{scroll-behavior:auto}}
</style>

<sc-if value="{{amb2.open}}" hint-placeholder-val="{{false}}">
  <div style="position: fixed; inset: 0; z-index: 61; display: flex; align-items: center; justify-content: center; padding: 20px; animation: ltcFade 200ms ease">
    <button type="button" onClick="{{amb2.close}}" aria-label="Close" style="position: absolute; inset: 0; background: #071A52C7; border: 0; cursor: pointer"></button>
    <div role="dialog" aria-modal="true" aria-label="Become a Liberty Ambassador" style="position: relative; width: 100%; max-width: 760px; max-height: 100%; overflow: auto; background: #FFFFFF; border-radius: 8px; box-shadow: 0 24px 60px #071A5266; animation: ltcPop 260ms ease">
      <div style="height: 8px; background: repeating-linear-gradient(90deg, #B31942 0 40px, #FFFFFF 40px 80px, #0A35C8 80px 120px)"></div>
      <button type="button" onClick="{{amb2.close}}" aria-label="Close" style="position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #0A35C8; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <div style="background: #0A35C8; color: #FFFFFF; padding: 26px 28px 22px">
        <div style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #C9D6FF">Liberty Ambassador Program</div>
        <h2 style="margin: 6px 60px 0 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase">Earn $10 Per Caddy</h2>
        <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #DDE5FF">Tell us about you and your audience. Post real demos with your own link and get paid every month.</p>
      </div>
      <sc-if value="{{amb2.form}}" hint-placeholder-val="{{true}}">
        <form onSubmit="{{amb2.submit}}" style="padding: 24px 28px 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Full Name *<input name="ambname" type="text" required autocomplete="name" style="height: 48px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; background: #FFFFFF"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Email *<input name="ambemail" type="email" required autocomplete="email" style="height: 48px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; background: #FFFFFF"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Phone<input name="ambphone" type="tel" autocomplete="tel" style="height: 48px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; background: #FFFFFF"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">City, State<input name="ambcity" type="text" autocomplete="address-level2" style="height: 48px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; background: #FFFFFF"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">What Do You Do? *<select name="ambrole" required style="height: 48px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; background: #FFFFFF"><option value="">Choose one</option><sc-for list="{{amb2.roles}}" as="o" hint-placeholder-count="5"><option>{{o}}</option></sc-for></select></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Years In The Industry *<select name="ambyears" required style="height: 48px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; background: #FFFFFF"><option value="">Choose one</option><sc-for list="{{amb2.years}}" as="o" hint-placeholder-count="5"><option>{{o}}</option></sc-for></select></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Main Social Handle Or Link *<input name="ambhandle" type="text" required placeholder="@yourhandle or profile link" style="height: 48px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; background: #FFFFFF"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Total Followers *<select name="ambfollowers" required style="height: 48px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; background: #FFFFFF"><option value="">Choose a range</option><sc-for list="{{amb2.followers}}" as="o" hint-placeholder-count="5"><option>{{o}}</option></sc-for></select></label>
          <fieldset style="grid-column: 1 / -1; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
            <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Where Do You Post?</legend>
            <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{amb2.platforms}}" as="o" hint-placeholder-count="6"><label style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 22px; font-size: 14px; font-weight: 600; color: #071A52; background: #FFFFFF; cursor: pointer; text-transform: none; letter-spacing: 0"><input type="checkbox" name="ambplat" value="{{o}}" style="width: 18px; height: 18px; accent-color: #B31942">{{o}}</label></sc-for></div>
          </fieldset>
          <fieldset style="grid-column: 1 / -1; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
            <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">What Do You Post?</legend>
            <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{amb2.content}}" as="o" hint-placeholder-count="5"><label style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 22px; font-size: 14px; font-weight: 600; color: #071A52; background: #FFFFFF; cursor: pointer; text-transform: none; letter-spacing: 0"><input type="checkbox" name="ambcontent" value="{{o}}" style="width: 18px; height: 18px; accent-color: #B31942">{{o}}</label></sc-for></div>
          </fieldset>
          <fieldset style="grid-column: 1 / -1; margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
            <legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Do You Use The Tape Caddy? *</legend>
            <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{amb2.caddy}}" as="o" hint-placeholder-count="3"><label style="display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1.5px solid #B8C1CD; border-radius: 22px; font-size: 14px; font-weight: 600; color: #071A52; background: #FFFFFF; cursor: pointer; text-transform: none; letter-spacing: 0"><input type="radio" name="ambcaddy" value="{{o}}" required style="width: 18px; height: 18px; accent-color: #B31942">{{o}}</label></sc-for></div>
          </fieldset>
          <label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #3B4658">Why Do You Want To Be An Ambassador?<textarea name="ambwhy" rows="3" placeholder="Tell us about your work and your audience." style="padding: 12px 14px; border: 1.5px solid #B8C1CD; border-radius: 10px; font-size: 16px; text-transform: none; letter-spacing: 0; color: #071A52; resize: vertical"></textarea></label>
          <label style="grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.5; color: #3B4658; cursor: pointer"><input type="checkbox" name="ambterms" required style="width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: #B31942">I agree to the Ambassador Terms: real demos only, #ad on paid posts, and no Amazon listings or resale.</label>
          <button type="submit" style="grid-column: 1 / -1; min-height: 56px; border: 0; border-radius: 10px; background: #B31942; color: #FFFFFF; cursor: pointer; font-family: Poppins, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase">Send My Application →</button>
        </form>
      </sc-if>
      <sc-if value="{{amb2.sent}}" hint-placeholder-val="{{false}}">
        <div role="status" style="padding: 40px 28px 44px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px">
          <div style="width: 72px; height: 72px; border-radius: 50%; background: #2E7D4F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3"><path d="M4 12.5l5 5L20 6.5"></path></svg></div>
          <h3 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: 29px; line-height: 1; text-transform: uppercase; color: #0A35C8">Thanks, {{amb2.first}}! You're On The List.</h3>
          <p style="margin: 0; max-width: 480px; font-size: 16px; line-height: 1.6; color: #3B4658">We got your application and we'll be reaching out soon. Keep an eye on your email and phone for your personal link and next steps.</p>
          <button type="button" onClick="{{amb2.close}}" style="margin-top: 8px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 10px; background: #0A35C8; color: #FFFFFF; cursor: pointer; font-family: Poppins, sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase">Back To The Site</button>
        </div>
      </sc-if>
    </div>
  </div>
</sc-if>

<!-- JOB DESCRIPTION POPUP -->
<sc-if value="{{jd.open}}" hint-placeholder-val="{{false}}">
  <div style="position: fixed; inset: 0; z-index: 60; background: #071A52B3; display: flex; align-items: center; justify-content: center; padding: 16px; animation: ltcFade 200ms ease">
    <div role="dialog" aria-modal="true" aria-label="{{jd.title}}" style="position: relative; width: 100%; max-width: 760px; max-height: 100%; overflow: auto; background: #FFFFFF; border-radius: 8px; box-shadow: 0 30px 80px #00000066; animation: ltcPop 240ms ease">
      <div style="background: #0A35C8; color: #FFFFFF; padding: 26px 28px 22px; border-top: 6px solid {{jd.color}}">
        <button type="button" onClick="{{jd.close}}" aria-label="Close" style="position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #FFFFFF22; color: #FFFFFF; font-size: 24px; cursor: pointer">×</button>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #C9D6FF">Job Description</div>
        <h2 style="margin: 6px 50px 0 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: clamp(21px, 2.5vw, 30px); line-height: 1; text-transform: uppercase">{{jd.title}}</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px">
          <sc-for list="{{jd.facts}}" as="f" hint-placeholder-count="3"><span style="background: #FFFFFF; color: #0A35C8; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 10px"><span style="color: #4A5568; font-weight: 600">{{f.k}}:</span> {{f.v}}</span></sc-for>
        </div>
      </div>
      <div style="padding: 24px 28px 28px; display: flex; flex-direction: column; gap: 20px">
        <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3B4658">{{jd.summary}}</p>
        <div>
          <div style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 18px; text-transform: uppercase; color: #0A35C8">What You'll Do</div>
          <ul style="margin: 8px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.7; color: #071A52"><sc-for list="{{jd.duties}}" as="x" hint-placeholder-count="5"><li>{{x}}</li></sc-for></ul>
        </div>
        <div>
          <div style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 18px; text-transform: uppercase; color: #0A35C8">What You Bring</div>
          <ul style="margin: 8px 0 0; padding-left: 20px; font-size: 15px; line-height: 1.7; color: #071A52"><sc-for list="{{jd.reqs}}" as="x" hint-placeholder-count="4"><li>{{x}}</li></sc-for></ul>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 6px; border-top: 1px solid #D3D9E2">
          <a href="#apply" onClick="{{jd.apply}}" style="display: inline-flex; align-items: center; min-height: 50px; padding: 0 22px; background: #B31942; color: #FFFFFF; text-decoration: none; border-radius: 12px; border: 1px solid #DCE3F7; box-shadow: 0 12px 30px rgba(7,26,82,0.10); font-family: Poppins, sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase">Apply For This Job →</a>
          <button type="button" onClick="{{jd.close}}" style="min-height: 50px; padding: 0 16px; background: transparent; border: 0; color: #0A35C8; font-weight: 700; cursor: pointer">Close</button>
          <span style="font-size: 13px; color: #4A5568">Or email your resume to sales@libertytoolcompany.com with the job title in the subject line.</span>
        </div>
      </div>
    </div>
  </div>
</sc-if>

<!-- POPUP -->
<sc-if value="{{modalOpen}}" hint-placeholder-val="{{false}}">
  <div style="position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; animation: ltcFade 200ms ease">
    <button type="button" onClick="{{closeModal}}" aria-label="Close" style="position: absolute; inset: 0; background: #071A52C7; border: 0; cursor: pointer"></button>
    <div role="dialog" aria-modal="true" aria-label="{{modal.title}}" style="position: relative; width: 100%; max-width: 980px; max-height: 100%; overflow: auto; background: #FFFFFF; border-radius: 8px; box-shadow: 0 24px 60px #071A5266; animation: ltcPop 260ms ease">
      <div style="height: 8px; background: repeating-linear-gradient(90deg, #B31942 0 40px, #FFFFFF 40px 80px, #0A35C8 80px 120px)"></div>
      <button type="button" onClick="{{closeModal}}" aria-label="Close" style="position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #0A35C8; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
      <div style="display: flex; flex-wrap: wrap">
        <div style="flex: 1 1 380px; min-width: 0; padding: 24px; background: #F4F5F7; display: flex; flex-direction: column; gap: 12px">
          <sc-if value="{{modal.isBA}}" hint-placeholder-val="{{false}}">
            <div style="position: relative; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: repeating-linear-gradient(135deg, #C9CED6 0 12px, #C1C7D0 12px 24px)">
              <span style="position: absolute; left: 62%; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #3B4658">Before Photo</span>
              <div style="position: absolute; inset: 0; clip-path: inset(0 {{modal.baClip}}% 0 0); background: #EEF3FA">
                <span style="position: absolute; left: 12%; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #0A35C8">After Photo</span>
              </div>
              <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: {{modal.ba}}%; width: 4px; margin-left: -2px; background: #B31942"></div>
              <div aria-hidden="true" style="position: absolute; top: 50%; left: {{modal.ba}}%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #B31942; border: 1px solid rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"></path></svg></div>
              <span style="position: absolute; top: 10px; left: 10px; background: #0A35C8; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 5px 8px; border-radius: 2px">AFTER</span>
              <span style="position: absolute; top: 10px; right: 10px; background: #FFFFFF; color: #071A52; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 5px 8px; border-radius: 2px">BEFORE</span>
            </div>
            <label style="display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #4A5568">Drag
              <input type="range" min="0" max="100" step="1" value="{{modal.ba}}" onChange="{{modal.onBa}}" aria-label="Compare before and after" style="flex: 1; min-width: 0; height: 40px">
            </label>
          </sc-if>
          <sc-if value="{{modal.isVideo}}" hint-placeholder-val="{{false}}">
            <div style="position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #071A52; display: flex; align-items: center; justify-content: center">
              <span style="width: 72px; height: 72px; border-radius: 50%; background: #B31942; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#FFFFFF"></path></svg></span>
              <span style="position: absolute; left: 12px; bottom: 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #C9D6FF">Video Coming Soon</span>
            </div>
          </sc-if>
          <sc-if value="{{modal.isPhoto}}" hint-placeholder-val="{{true}}">
          <div style="position: relative; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: {{modal.mainBg}}; border: 2px dashed {{modal.mainBorder}}; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box">
            <sc-if value="{{modal.hasMain}}" hint-placeholder-val="{{false}}">
              <img src="{{modal.mainImg}}" alt="{{modal.title}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block">
            </sc-if>
            <sc-if value="{{modal.noMain}}" hint-placeholder-val="{{true}}">
              <span style="display: flex; flex-direction: column; align-items: center; gap: 10px; color: #4A5568">
                <svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg>
                <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">{{modal.mainLabel}}</span>
              </span>
            </sc-if>
          </div>
          </sc-if>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
            <sc-for list="{{modal.thumbs}}" as="t" hint-placeholder-count="3">
              <button type="button" onClick="{{t.pick}}" aria-label="{{t.label}}" style="position: relative; aspect-ratio: 4 / 3; border-radius: 4px; border: 3px solid {{t.ring}}; background: #E6EAF0; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden">
                <sc-if value="{{t.hasImg}}" hint-placeholder-val="{{false}}"><img src="{{t.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain"></sc-if>
                <sc-if value="{{t.noImg}}" hint-placeholder-val="{{true}}"><span style="font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #4A5568; line-height: 1.2">{{t.short}}</span></sc-if>
              </button>
            </sc-for>
          </div>
          <div style="font-size: 12px; color: #4A5568">{{modal.photoNote}}</div>
        </div>
        <div style="flex: 999 1 380px; min-width: 0; padding: 32px 30px 30px; display: flex; flex-direction: column; gap: 14px">
          <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #B31942; padding-right: 50px">{{modal.eyebrow}}</div>
          <h2 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 800; font-size: clamp(24px, 2.7vw, 33px); line-height: 0.98; text-transform: uppercase; color: #0A35C8">{{modal.title}}</h2>
          <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3B4658">{{modal.body}}</p>
          <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
            <sc-for list="{{modal.points}}" as="pt" hint-placeholder-count="4">
              <li style="display: flex; gap: 10px; font-size: 15px; font-weight: 500; line-height: 1.4"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B31942" stroke-width="2.8" style="flex: none"><path d="M4 12.5l5 5L20 6.5"></path></svg>{{pt}}</li>
            </sc-for>
          </ul>
          <sc-if value="{{modal.hasChips}}" hint-placeholder-val="{{false}}">
            <div>
              <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #4A5568">{{modal.chipsLabel}}</div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
                <sc-for list="{{modal.chips}}" as="c" hint-placeholder-count="3">
                  <button type="button" onClick="{{c.open}}" style="min-height: 40px; padding: 0 12px; border-radius: 20px; border: 2px solid #0A35C8; background: #EEF3FA; color: #0A35C8; cursor: pointer; font-size: 14px; font-weight: 700">{{c.label}}</button>
                </sc-for>
              </div>
            </div>
