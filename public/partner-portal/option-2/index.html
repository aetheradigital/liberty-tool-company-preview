<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTC Partner Portal — Option 2</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/logo-blue.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2F5FF;color:#071A52;font-family:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:#0A35C8}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #B31942;outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:#0A35C8;color:#FFFFFF;padding:22px 16px;display:flex;flex-direction:column;gap:18px}
.side .nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#D6E0F2;padding:11px 12px;border-radius:12px;font-weight:600;font-size:15px}
.nv:hover{background:rgba(255,255,255,0.08);color:#FFFFFF}
.nv[aria-current="page"]{background:#FFFFFF;color:#0A35C8}
.badge{min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#B31942;color:#FFFFFF;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.main{min-width:0;padding:26px 32px 64px}
.h1{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:30px;line-height:1.05;margin:0}
.h2{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:21px;line-height:1.1;margin:0}
.h3{font-family:Poppins, sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-0.01em;font-size:16px;line-height:1.15;margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#B31942}
.muted{color:#4A5578}
.card{background:#FFFFFF;border:1px solid #DCE3F7;border-radius:20px;box-shadow:0 12px 30px rgba(7,26,82,0.08);padding:20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi .n{font-family:Poppins, sans-serif;font-weight:800;font-size:34px;line-height:1;color:#0A35C8}
.kpi .l{margin-top:6px;font-size:13px;font-weight:600;color:#4A5578}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid #0A35C8;background:#0A35C8;color:#FFFFFF;font-weight:700;font-size:14px;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none}
.btn.red{background:#B31942;border-color:#B31942}
.btn.ghost{background:#FFFFFF;color:#0A35C8}
.btn.sm{min-height:34px;padding:0 12px;font-size:12px}
.btn[disabled]{opacity:0.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid #DCE3F7;background:#FFFFFF;font-size:13px;font-weight:600;color:#071A52}
.chip[aria-pressed="true"]{background:#0A35C8;border-color:#0A35C8;color:#FFFFFF}
.st{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#4A5578;margin-bottom:6px}
.inp{width:100%;min-height:44px;padding:0 12px;border:1px solid #C9D4F2;border-radius:12px;background:#FFFFFF;font-size:15px}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical}
.tbl{font-size:14px;min-width:var(--minw)}
.tr{display:grid;grid-template-columns:var(--cols);gap:0 12px;align-items:center;padding:11px 10px;border-bottom:1px solid #DCE3F7}
.tr.th{padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#4A5578}
.tr.click{cursor:pointer}
.tr.click:hover{background:#E8EEFF}
.scroll{overflow-x:auto}
.opt{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:20px;border:1px solid #DCE3F7;background:#FFFFFF;min-height:118px}
.opt[aria-pressed="true"]{border:2px solid #0A35C8;background:#E8EEFF;padding:15px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.stp{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;background:#FFFFFF;border:1px solid #DCE3F7;font-weight:600;font-size:14px}
.stp .d{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#E8EEFF;color:#0A35C8;font-weight:800;font-size:13px}
.stp[aria-current="step"]{border-color:#0A35C8}
.stp[aria-current="step"] .d{background:#0A35C8;color:#FFFFFF}
.qty{display:inline-flex;align-items:center;border:1px solid #C9D4F2;border-radius:12px;overflow:hidden;background:#FFFFFF}
.qty button{width:36px;height:38px;border:0;background:#E8EEFF;font-weight:800;color:#0A35C8}
.qty input{width:62px;height:38px;border:0;text-align:center;font-weight:700}
.bub{max-width:560px;padding:12px 14px;border-radius:20px;font-size:15px;line-height:1.5}
.tl{display:flex;flex-wrap:wrap;gap:0}
.tl .s{flex:1 1 110px;min-width:110px;padding:10px 8px 0;border-top:4px solid #DCE3F7;font-size:13px}
.tl .s.done{border-top-color:#2E7D4F}
.tl .s.now{border-top-color:#0A35C8}
.toast{position:fixed;right:20px;bottom:20px;z-index:40;background:#071A52;color:#FFFFFF;padding:14px 18px;border-radius:20px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,0.25)}
.thumb{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#E8EEFF;display:block}
.demo{display:flex;gap:6px;background:rgba(255,255,255,0.1);padding:4px;border-radius:999px}
.demo button{flex:1;border:0;border-radius:999px;padding:7px 8px;font-size:12px;font-weight:700;background:transparent;color:#D6E0F2}
.demo button[aria-pressed="true"]{background:#FFFFFF;color:#0A35C8}
@media (max-width: 860px){.app{grid-template-columns:1fr}.side{padding:16px}.side .nav{flex-direction:row;flex-wrap:wrap}.nv{width:auto}.main{padding:20px 16px 56px}}
</style>

</head>
<body>
<div id="ltc-preview-bar" style="position: relative; z-index: 60; background: #0B1424; color: #FFFFFF; font: 500 13px/1.2 Inter, system-ui, sans-serif">
  <div style="max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px">
    <a href="/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap">← LTC Preview Portal</a>
    <span style="opacity: 0.35">|</span>
    <nav aria-label="Preview pages" style="display: flex; flex-wrap: wrap; gap: 8px 20px"><a href="/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Option 1 · Classic</a><a href="/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Option 2 · Fun</a><a href="/approvals/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Social Posting Calendar</a><a href="/partner-portal/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Partner Portal 1</a><a href="/partner-portal/option-2/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; white-space: nowrap; border-bottom: 2px solid #B31942; padding-bottom: 2px">Partner Portal 2</a><a href="/affiliate-portal/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Affiliate Portal 1</a><a href="/affiliate-portal/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Affiliate Portal 2</a><a href="/admin/option-1/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Admin 1</a><a href="/admin/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Admin 2</a></nav>
  </div>
</div>
<script>if(window.self!==window.top){document.getElementById('ltc-preview-bar').style.display='none';}</script>
<template id="tpl">

<div class="app">
  <aside class="side">
    <img src="/assets/logo-white.png" alt="Liberty Tool Company" style="height: 56px; width: auto; align-self: flex-start">
    <div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #AFC0DC">{{portalLabel}}</div>
      <div style="margin-top: 4px; font-weight: 700; font-size: 16px; line-height: 1.3">{{sideTitle}}</div>
      <div style="font-size: 13px; color: #C9D6EC">{{sideSub}}</div>
    </div>
    <sc-if value="{{isPortal}}" hint-placeholder-val="{{true}}">
      <div>
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #AFC0DC; margin-bottom: 6px">Demo: View As</div>
        <div class="demo" role="group" aria-label="Demo account">
          <button type="button" aria-pressed="{{acctEnt}}" onClick="{{pickEnt}}">Enterprise</button>
          <button type="button" aria-pressed="{{acctDist}}" onClick="{{pickDist}}">Distributor</button>
        </div>
      </div>
    </sc-if>
    <nav class="nav" aria-label="Portal">
      <sc-for list="{{navs}}" as="n" hint-placeholder-count="7">
        <button type="button" class="nv" aria-current="{{n.cur}}" onClick="{{n.go}}"><span>{{n.label}}</span><sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge">{{n.badge}}</span></sc-if></button>
      </sc-for>
    </nav>
    <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}">
      <div>
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #AFC0DC; margin: 0 0 6px 12px">Affiliate Program</div>
        <nav class="nav" aria-label="Affiliate program">
          <sc-for list="{{navs2}}" as="n" hint-placeholder-count="3">
            <button type="button" class="nv" aria-current="{{n.cur}}" onClick="{{n.go}}"><span>{{n.label}}</span><sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="badge">{{n.badge}}</span></sc-if></button>
          </sc-for>
        </nav>
      </div>
    </sc-if>
    <div style="margin-top: auto; font-size: 12px; line-height: 1.5; color: #AFC0DC">{{sideFoot}}</div>
  </aside>

  <main class="main">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 22px">
      <div>
        <div class="eyebrow">{{crumb}}</div>
        <h1 class="h1" style="margin-top: 6px">{{title}}</h1>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-if value="{{isPortal}}" hint-placeholder-val="{{true}}"><button type="button" class="btn red" onClick="{{goNewOrder}}">+ New Order</button></sc-if>
        <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><button type="button" class="btn ghost" onClick="{{reloadData}}">Refresh</button></sc-if>
      </div>
    </div>

    <!-- ================= PORTAL: OVERVIEW ================= -->
    <sc-if value="{{v.overview}}" hint-placeholder-val="{{true}}">
      <div class="card" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; background: #E8EEFF">
        <div>
          <h2 class="h2">Welcome Back, {{acct.first}}.</h2>
          <div class="muted" style="margin-top: 6px">{{acct.name}} · {{acct.type}} · {{acct.terms}}</div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <span class="chip">Pricing: {{acct.modelName}}</span>
          <span class="chip">Your Rep: LTC Sales · 239-744-8403</span>
        </div>
      </div>
      <div class="grid g4" style="margin-top: 16px">
        <sc-for list="{{pKpis}}" as="k" hint-placeholder-count="4"><div class="card kpi"><div class="n">{{k.n}}</div><div class="l">{{k.l}}</div></div></sc-for>
      </div>
      <div class="grid g4" style="margin-top: 16px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
          <button type="button" class="card" onClick="{{q.go}}" style="text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer">
            <span class="h3" style="color: #0A35C8">{{q.t}}</span><span class="muted" style="font-size: 14px">{{q.d}}</span>
          </button>
        </sc-for>
      </div>
      <div class="grid g2" style="margin-top: 16px; align-items: start">
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><h3 class="h3">Recent Orders</h3><button type="button" class="btn ghost sm" onClick="{{goOrders}}">All Orders</button></div>
          <div class="scroll" style="margin-top: 8px"><div class="tbl" style="--cols: 1.3fr 1.2fr 0.6fr 1fr; --minw: 0"><div class="tr th"><div>Order</div><div>PO</div><div>Units</div><div>Status</div></div>
            <sc-for list="{{recentOrders}}" as="o" hint-placeholder-count="4"><div class="tr click" onClick="{{o.open}}"><div><b>{{o.id}}</b><div class="muted" style="font-size: 12px">{{o.created}}</div></div><div>{{o.po}}</div><div>{{o.units}}</div><div><span class="st" style="background: {{o.sbg}}; color: {{o.sfg}}">{{o.status}}</span></div></div></sc-for>
          </div></div>
        </div>
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><h3 class="h3">Messages</h3><button type="button" class="btn ghost sm" onClick="{{goMessages}}">Open</button></div>
          <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px">
            <sc-for list="{{recentMsgs}}" as="m" hint-placeholder-count="2"><div style="padding: 12px; border-radius: 12px; background: #E8EEFF"><div style="font-size: 12px; font-weight: 700; color: #4A5578">{{m.from}} · {{m.when}}</div><div style="margin-top: 4px; font-size: 14px; line-height: 1.5">{{m.text}}</div></div></sc-for>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- ================= PORTAL: NEW ORDER ================= -->
    <sc-if value="{{v.order}}" hint-placeholder-val="{{false}}">
      <sc-if value="{{notSubmitted}}" hint-placeholder-val="{{true}}">
        <div class="steps" role="list">
          <sc-for list="{{stepList}}" as="s" hint-placeholder-count="4"><button type="button" class="stp" role="listitem" aria-current="{{s.cur}}" onClick="{{s.go}}"><span class="d">{{s.n}}</span>{{s.label}}</button></sc-for>
        </div>

        <!-- step 1 -->
        <sc-if value="{{step1}}" hint-placeholder-val="{{true}}">
          <div class="card" style="margin-top: 16px">
            <h2 class="h2">What Kind Of Order?</h2>
            <div class="grid g4" style="margin-top: 14px">
              <sc-for list="{{orderTypes}}" as="t" hint-placeholder-count="4">
                <button type="button" class="opt" aria-pressed="{{t.on}}" onClick="{{t.pick}}"><span class="h3" style="color: #0A35C8">{{t.name}}</span><span class="muted" style="font-size: 13px; line-height: 1.45">{{t.desc}}</span></button>
              </sc-for>
            </div>
          </div>
          <div class="card" style="margin-top: 16px">
            <h2 class="h2">Purchase Order Details</h2>
            <div class="grid g3" style="margin-top: 14px">
              <sc-for list="{{poFields}}" as="f" hint-placeholder-count="9">
                <label><span class="lbl">{{f.label}}</span><input class="inp" type="{{f.type}}" value="{{f.val}}" placeholder="{{f.ph}}" onChange="{{f.set}}"></label>
              </sc-for>
            </div>
            <label style="display: block; margin-top: 14px"><span class="lbl">Notes For LTC</span><textarea class="inp" placeholder="Reset dates, special handling, anything we should know." onChange="{{setNotes}}">{{form.notes}}</textarea></label>
          </div>
        </sc-if>

        <!-- step 2 -->
        <sc-if value="{{step2}}" hint-placeholder-val="{{false}}">
          <div class="card" style="margin-top: 16px; background: #E8EEFF">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
              <div style="min-width: 0; flex: 1 1 360px">
                <div class="eyebrow">Your Pricing</div>
                <h2 class="h2" style="margin-top: 4px">{{acct.modelName}}</h2>
                <p class="muted" style="margin: 6px 0 0; line-height: 1.55">{{acct.modelDesc}}</p>
              </div>
              <sc-if value="{{showTiers}}" hint-placeholder-val="{{false}}">
                <div style="display: flex; flex-wrap: wrap; gap: 8px">
                  <sc-for list="{{tierCards}}" as="t" hint-placeholder-count="3"><div style="padding: 10px 12px; border-radius: 12px; background: #FFFFFF; border: {{t.border}}; min-width: 120px"><div style="font-weight: 800; color: #0A35C8">{{t.name}}</div><div style="font-size: 13px" class="muted">{{t.rule}}</div><div style="font-size: 13px; font-weight: 700">{{t.off}}</div></div></sc-for>
                </div>
              </sc-if>
            </div>
            <sc-if value="{{multiStore}}" hint-placeholder-val="{{false}}"><div style="margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #FFFFFF; font-size: 14px"><b>Multi-store order:</b> quantities below are <b>per store</b>. They'll be multiplied by your {{storeCount}} stores on the next step.</div></sc-if>
          </div>
          <div class="card" style="margin-top: 16px">
            <h2 class="h2">Tape Caddy & Kits</h2>
            <div class="scroll" style="margin-top: 8px"><div class="tbl" style="--cols: 64px minmax(160px,2fr) 0.8fr 1fr 150px 1fr; --minw: 720px"><div class="tr th"><div></div><div>Item</div><div>MSRP</div><div>Your Price</div><div>{{qtyHead}}</div><div style="text-align: right">Line Total</div></div>
              <sc-for list="{{prodRows}}" as="p" hint-placeholder-count="8">
                <div class="tr"><div style="width: 64px"><img class="thumb" src="{{p.img}}" alt=""></div><div><b>{{p.name}}</b><div class="muted" style="font-size: 12px">{{p.tag}}</div></div><div>{{p.msrp}}</div><div style="font-weight: 700; color: {{p.priceColor}}">{{p.price}}</div>
                  <div><div class="qty"><button type="button" aria-label="Less {{p.name}}" onClick="{{p.dec}}">−</button><input type="number" min="0" inputmode="numeric" aria-label="Quantity {{p.name}}" value="{{p.qty}}" onChange="{{p.set}}"><button type="button" aria-label="More {{p.name}}" onClick="{{p.inc}}">+</button></div></div>
                  <div style="text-align: right; font-weight: 700">{{p.line}}</div></div>
              </sc-for>
            </div></div>
          </div>
          <div class="grid g2" style="margin-top: 16px; align-items: start">
            <div class="card">
              <h3 class="h3">Coating Tools</h3>
              <p class="muted" style="margin: 6px 0 10px; font-size: 14px">Priced on confirmation.</p>
              <sc-for list="{{toolRows}}" as="p" hint-placeholder-count="2">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #DCE3F7"><span style="display: flex; align-items: center; gap: 10px"><img class="thumb" src="{{p.img}}" alt=""><b>{{p.name}}</b></span><div class="qty"><button type="button" aria-label="Less {{p.name}}" onClick="{{p.dec}}">−</button><input type="number" min="0" aria-label="Quantity {{p.name}}" value="{{p.qty}}" onChange="{{p.set}}"><button type="button" aria-label="More {{p.name}}" onClick="{{p.inc}}">+</button></div></div>
              </sc-for>
            </div>
            <div class="card">
              <h3 class="h3">Coatings — Quote Request</h3>
              <p class="muted" style="margin: 6px 0 10px; font-size: 14px">Tap any you want priced. Your rep sends a quote with the order confirmation.</p>
              <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{coatRows}}" as="c" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{c.on}}" onClick="{{c.toggle}}">{{c.name}}</button></sc-for></div>
            </div>
          </div>
        </sc-if>

        <!-- step 3 -->
        <sc-if value="{{step3}}" hint-placeholder-val="{{false}}">
          <sc-if value="{{multiStore}}" hint-placeholder-val="{{false}}">
            <div class="card" style="margin-top: 16px">
              <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center">
                <div><h2 class="h2">Store List</h2><div class="muted" style="margin-top: 4px">{{storeCount}} stores · each store receives the per-store pack.</div></div>
                <label class="btn ghost sm" style="cursor: pointer; position: relative">Upload Store List (CSV)<input type="file" accept=".csv,text/csv" onChange="{{uploadStores}}" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
              </div>
              <div class="muted" style="font-size: 13px; margin-top: 8px">CSV columns: store number, city, state. Or add stores one at a time.</div>
              <div class="scroll" style="margin-top: 8px"><div class="tbl" style="--cols: 1fr 1.5fr 0.6fr 110px; --minw: 420px"><div class="tr th"><div>Store #</div><div>City</div><div>State</div><div></div></div>
                <sc-for list="{{storeRows}}" as="s" hint-placeholder-count="3"><div class="tr"><div>{{s.num}}</div><div>{{s.city}}</div><div>{{s.st}}</div><div style="text-align: right"><button type="button" class="btn ghost sm" onClick="{{s.remove}}">Remove</button></div></div></sc-for>
              </div></div>
              <div class="grid g4" style="margin-top: 12px; align-items: end">
                <label><span class="lbl">Store #</span><input class="inp" value="{{ns.num}}" onChange="{{setNsNum}}" placeholder="0412"></label>
                <label><span class="lbl">City</span><input class="inp" value="{{ns.city}}" onChange="{{setNsCity}}" placeholder="Columbus"></label>

          <sc-if value="{{singleShip}}" hint-placeholder-val="{{true}}">

              </div>
            </div>
          </sc-if>
          <div class="grid g2" style="margin-top: 16px; align-items: start">
            <div class="card">
              <h3 class="h3">Freight & Payment</h3>
              <label style="display: block; margin-top: 12px"><span class="lbl">Freight Terms</span><select class="inp" value="{{form.freight}}" onChange="{{setFreight}}"><sc-for list="{{freightOpts}}" as="o" hint-placeholder-count="3"><option value="{{o}}">{{o}}</option></sc-for></select></label>
              <label style="display: block; margin-top: 12px"><span class="lbl">Payment</span><select class="inp" value="{{form.pay}}" onChange="{{setPay}}"><sc-for list="{{payOpts}}" as="o" hint-placeholder-count="3"><option value="{{o}}">{{o}}</option></sc-for></select></label>
              <sc-if value="{{showCarrier}}" hint-placeholder-val="{{false}}"><label style="display: block; margin-top: 12px"><span class="lbl">Your Carrier & Account #</span><input class="inp" value="{{form.carrier}}" onChange="{{setCarrier}}" placeholder="Carrier name and account number"></label></sc-if>
              <div class="muted" style="font-size: 13px; margin-top: 10px">{{freightNote}}</div>
            </div>
            <div class="card">
              <h3 class="h3">Compliance & Documents</h3>
              <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px"><sc-for list="{{reqRows}}" as="r" hint-placeholder-count="4"><button type="button" class="chip" aria-pressed="{{r.on}}" onClick="{{r.toggle}}">{{r.name}}</button></sc-for></div>
              <div class="grid g2" style="margin-top: 12px; gap: 10px">
                <sc-for list="{{docSlots}}" as="d" hint-placeholder-count="2"><label class="card" style="padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px"><b style="font-size: 14px">{{d.label}}</b><span class="muted" style="font-size: 13px">{{d.file}}</span><input type="file" onChange="{{d.set}}" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label></sc-for>
              </div>
            </div>
          </div>

        <!-- step 4 -->
        <sc-if value="{{step4}}" hint-placeholder-val="{{false}}">
          <div class="grid g2" style="margin-top: 16px; align-items: start">
            <div class="card">
              <h2 class="h2">Review</h2>
              <div style="margin-top: 12px; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 14px">
                <sc-for list="{{reviewRows}}" as="r" hint-placeholder-count="8"><span class="muted" style="font-weight: 600">{{r.k}}</span><span style="font-weight: 600">{{r.v}}</span></sc-for>
              </div>
            </div>
            <div class="card">
              <h2 class="h2">Items</h2>
              <div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px">
                <sc-for list="{{reviewLines}}" as="l" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding-bottom: 8px; border-bottom: 1px solid #DCE3F7"><span>{{l.q}} × {{l.name}}</span><b>{{l.total}}</b></div></sc-for>
              </div>
            </div>
          </div>
        </sc-if>

        <!-- totals + nav -->
        <div class="card" style="margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
          <div style="display: flex; flex-wrap: wrap; gap: 22px">
            <sc-for list="{{totals}}" as="t" hint-placeholder-count="4"><div><div class="lbl" style="margin: 0">{{t.k}}</div><div style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 24px; color: {{t.c}}">{{t.v}}</div></div></sc-for>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
            <sc-if value="{{hasErr}}" hint-placeholder-val="{{false}}"><span style="color: #B31942; font-weight: 600; font-size: 14px">{{err}}</span></sc-if>
            <sc-if value="{{canBack}}" hint-placeholder-val="{{false}}"><button type="button" class="btn ghost" onClick="{{back}}">Back</button></sc-if>
            <button type="button" class="btn {{nextClass}}" onClick="{{next}}">{{nextLabel}}</button>
          </div>
        </div>
        <div class="muted" style="font-size: 12px; margin-top: 10px">{{priceFoot}}</div>
      </sc-if>

      <sc-if value="{{submitted}}" hint-placeholder-val="{{false}}">
        <div class="card" style="text-align: center; padding: 40px 24px">
          <div class="eyebrow">Order Received</div>
          <h2 class="h1" style="margin-top: 8px">{{lastOrder.id}}</h2>
          <p class="muted" style="max-width: 560px; margin: 10px auto 0; line-height: 1.6">Thanks. We'll confirm pricing and freight, then email your acknowledgement. You'll get tracking the day it ships, and we check in 3 days after delivery.</p>
          <div class="tl" style="max-width: 760px; margin: 24px auto 0; text-align: left"><sc-for list="{{lastOrder.steps}}" as="s" hint-placeholder-count="5"><div class="s {{s.cls}}"><b>{{s.name}}</b><div class="muted">{{s.when}}</div></div></sc-for></div>
          <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px"><button type="button" class="btn" onClick="{{goOrders}}">View My Orders</button><button type="button" class="btn ghost" onClick="{{goNewOrder}}">Start Another Order</button></div>
        </div>
      </sc-if>
    </sc-if>

    <!-- ================= ORDERS (portal + admin) ================= -->
    <sc-if value="{{v.orders}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px"><sc-for list="{{statusFilters}}" as="f" hint-placeholder-count="6"><button type="button" class="chip" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start">
        <div class="card" style="grid-column: span 2; min-width: 0">
          <div class="scroll"><div class="tbl" style="--cols: {{ordCols}}; --minw: {{ordMin}}"><div class="tr th"><div>Order</div><sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div>Account</div></sc-if><div>PO</div><div>Type</div><div>Units</div><div>Value</div><div>Status</div></div>
            <sc-for list="{{orderRows}}" as="o" hint-placeholder-count="6"><div class="tr click" onClick="{{o.open}}" style="background: {{o.rowBg}}"><div><b>{{o.id}}</b><div class="muted" style="font-size: 12px">{{o.created}}</div></div><sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div>{{o.acctName}}</div></sc-if><div>{{o.po}}</div><div>{{o.typeName}}</div><div>{{o.units}}</div><div>{{o.valueTxt}}</div><div><span class="st" style="background: {{o.sbg}}; color: {{o.sfg}}">{{o.status}}</span></div></div></sc-for>
          </div></div>
          <sc-if value="{{noOrders}}" hint-placeholder-val="{{false}}"><p class="muted">No orders here yet.</p></sc-if>
        </div>
      </div>
      <sc-if value="{{hasSel}}" hint-placeholder-val="{{false}}">
        <div class="card" style="margin-top: 16px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
            <div><div class="eyebrow">{{sel.typeName}}</div><h2 class="h2" style="margin-top: 4px">{{sel.id}} · PO {{sel.po}}</h2><div class="muted" style="margin-top: 4px">{{sel.acctName}} · {{sel.units}} units · {{sel.valueTxt}} · Ship window {{sel.window}}</div></div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <sc-if value="{{isPortal}}" hint-placeholder-val="{{true}}"><button type="button" class="btn ghost sm" onClick="{{reorder}}">Reorder</button><button type="button" class="btn ghost sm" onClick="{{goMessages}}">Ask About This Order</button></sc-if>
              <sc-if value="{{canAdvance}}" hint-placeholder-val="{{false}}"><button type="button" class="btn sm" onClick="{{advance}}">Mark {{nextStatus}}</button></sc-if>
            </div>
          </div>
          <div class="tl" style="margin-top: 18px"><sc-for list="{{sel.steps}}" as="s" hint-placeholder-count="5"><div class="s {{s.cls}}"><b>{{s.name}}</b><div class="muted">{{s.when}}</div></div></sc-for></div>
          <div class="grid g3" style="margin-top: 18px">
            <div><span class="lbl">Items</span><sc-for list="{{sel.lines}}" as="l" hint-placeholder-count="3"><div style="font-size: 14px; padding: 3px 0">{{l}}</div></sc-for></div>
            <div><span class="lbl">Ship To</span><div style="font-size: 14px; line-height: 1.5">{{sel.shipTo}}</div><div class="muted" style="font-size: 13px; margin-top: 6px">{{sel.freight}} · {{sel.pay}}</div></div>
            <div><span class="lbl">Tracking</span>
              <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><input class="inp" value="{{sel.tracking}}" placeholder="Add tracking number" onChange="{{setTracking}}"></sc-if>
              <sc-if value="{{isPortal}}" hint-placeholder-val="{{true}}"><div style="font-size: 14px">{{sel.trackingTxt}}</div></sc-if>
            </div>
          </div>
          <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div style="margin-top: 14px; padding: 12px; border-radius: 12px; background: #E8EEFF; font-size: 14px"><b>Commission:</b> {{sel.commission}} · <b>Quote items:</b> {{sel.quoteTxt}}</div></sc-if>
        </div>
      </sc-if>
    </sc-if>

    <!-- ================= FILES ================= -->
    <sc-if value="{{v.files}}" hint-placeholder-val="{{false}}">
      <div class="card">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center">
          <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{folderChips}}" as="f" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
          <label class="btn" style="cursor: pointer; position: relative">Upload File<input type="file" onChange="{{uploadFile}}" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
        </div>
        <div class="scroll" style="margin-top: 12px"><div class="tbl" style="--cols: {{fileCols}}; --minw: 560px"><div class="tr th"><div>File</div><sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div>Account</div></sc-if><div>Folder</div><div>Added</div><div>By</div></div>
          <sc-for list="{{fileRows}}" as="f" hint-placeholder-count="6"><div class="tr"><div><b>{{f.name}}</b></div><sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div>{{f.acctName}}</div></sc-if><div>{{f.folder}}</div><div>{{f.date}}</div><div>{{f.by}}</div></div></sc-for>
        </div></div>
        <div class="muted" style="font-size: 12px; margin-top: 10px">Uploads go to the folder selected above ({{uploadFolder}}). Mockup only: files are listed, not stored.</div>
      </div>

    <!-- ================= MESSAGES ================= -->
    <sc-if value="{{v.messages}}" hint-placeholder-val="{{false}}">
      <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px"><sc-for list="{{threadChips}}" as="t" hint-placeholder-count="2"><button type="button" class="chip" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div></sc-if>
      <div class="card" style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{thread}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; justify-content: {{m.side}}"><div class="bub" style="background: {{m.bg}}; color: {{m.fg}}"><div style="font-size: 12px; font-weight: 700; opacity: 0.8">{{m.from}} · {{m.when}}</div><div style="margin-top: 4px">{{m.text}}</div></div></div>
        </sc-for>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px"><sc-for list="{{quickReplies}}" as="q" hint-placeholder-count="3"><button type="button" class="chip" onClick="{{q.use}}">{{q.t}}</button></sc-for></div>
        <div style="display: flex; gap: 10px; align-items: flex-end">
          <label style="flex: 1"><span class="lbl">Message</span><textarea class="inp" placeholder="Type a message" onChange="{{setDraft}}">{{draft}}</textarea></label>
          <button type="button" class="btn" onClick="{{send}}">Send</button>
        </div>
      </div>
    </sc-if>

    <!-- ================= BOOK TIME ================= -->
    <sc-if value="{{v.book}}" hint-placeholder-val="{{false}}">
      <div class="card">
        <h2 class="h2">What Do You Need?</h2>
        <div class="grid g4" style="margin-top: 12px"><sc-for list="{{bookTypes}}" as="t" hint-placeholder-count="4"><button type="button" class="opt" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 96px"><span class="h3" style="color: #0A35C8">{{t.name}}</span><span class="muted" style="font-size: 13px">{{t.desc}}</span></button></sc-for></div>
        <h3 class="h3" style="margin-top: 20px">Pick A Day</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px"><sc-for list="{{bookDays}}" as="d" hint-placeholder-count="6"><button type="button" class="chip" aria-pressed="{{d.on}}" onClick="{{d.pick}}">{{d.label}}</button></sc-for></div>
        <h3 class="h3" style="margin-top: 18px">Pick A Time (Pacific)</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px"><sc-for list="{{bookTimes}}" as="d" hint-placeholder-count="6"><button type="button" class="chip" aria-pressed="{{d.on}}" onClick="{{d.pick}}">{{d.label}}</button></sc-for></div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px"><button type="button" class="btn red" onClick="{{confirmBook}}">Book It</button><span class="muted" style="font-size: 14px">{{bookHint}}</span></div>
      </div>
      <div class="card" style="margin-top: 16px">
        <h3 class="h3">Upcoming</h3>
        <sc-for list="{{bookRows}}" as="b" hint-placeholder-count="2"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #DCE3F7; font-size: 14px"><span><b>{{b.type}}</b> · {{b.acctName}}</span><span>{{b.when}}</span></div></sc-for>
        <sc-if value="{{noBooks}}" hint-placeholder-val="{{false}}"><p class="muted">Nothing booked yet.</p></sc-if>
      </div>

    <!-- ================= PRICE SHEET (portal) ================= -->
    <sc-if value="{{v.prices}}" hint-placeholder-val="{{false}}">
      <div class="card" style="background: #E8EEFF"><h2 class="h2">{{acct.modelName}}</h2><p class="muted" style="margin: 6px 0 0; line-height: 1.55">{{acct.modelDesc}}</p></div>
      <div class="card" style="margin-top: 16px"><div class="scroll"><div class="tbl" style="--cols: 2fr 1fr 1.6fr; --minw: 420px"><div class="tr th"><div>Item</div><div>MSRP</div><div>{{priceColHead}}</div></div>
        <sc-for list="{{sheetRows}}" as="r" hint-placeholder-count="8"><div class="tr"><div><b>{{r.name}}</b></div><div>{{r.msrp}}</div><div style="font-weight: 700">{{r.price}}</div></div></sc-for>
      </div></div>
      <div class="grid g3" style="margin-top: 14px"><sc-for list="{{termRows}}" as="t" hint-placeholder-count="3"><div style="padding: 12px; border-radius: 12px; background: #E8EEFF"><div class="lbl">{{t.k}}</div><div style="font-weight: 700">{{t.v}}</div></div></sc-for></div>
      <p class="muted" style="font-size: 13px; margin: 12px 0 0">Advertised prices may not go below MSRP. Prices shown as "Set by LTC" are confirmed on your acknowledgement.</p></div>
    </sc-if>

    <!-- ================= ADMIN: OVERVIEW ================= -->
    <sc-if value="{{v.aOverview}}" hint-placeholder-val="{{false}}">
      <div class="grid g4"><sc-for list="{{aKpis}}" as="k" hint-placeholder-count="5"><div class="card kpi"><div class="n">{{k.n}}</div><div class="l">{{k.l}}</div></div></sc-for></div>

        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><h3 class="h3">Needs Action</h3><button type="button" class="btn ghost sm" onClick="{{goOrders}}">Order Queue</button></div>
          <div class="scroll" style="margin-top: 8px"><div class="tbl" style="--cols: 1fr 1.4fr 1fr 1.8fr; --minw: 520px"><div class="tr th"><div>Order</div><div>Account</div><div>Status</div><div>Next Step</div></div>
            <sc-for list="{{actionRows}}" as="o" hint-placeholder-count="4"><div class="tr click" onClick="{{o.open}}"><div><b>{{o.id}}</b></div><div>{{o.acctName}}</div><div><span class="st" style="background: {{o.sbg}}; color: {{o.sfg}}">{{o.status}}</span></div><div class="muted">{{o.todo}}</div></div></sc-for>
          </div></div>
        </div>
        <div class="card">
          <h3 class="h3">Coming Up</h3>
          <sc-for list="{{bookRows}}" as="b" hint-placeholder-count="2"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #DCE3F7; font-size: 14px"><span><b>{{b.type}}</b> · {{b.acctName}}</span><span>{{b.when}}</span></div></sc-for>
          <h3 class="h3" style="margin-top: 18px">Latest Messages</h3>
          <sc-for list="{{aMsgs}}" as="m" hint-placeholder-count="2"><button type="button" onClick="{{m.open}}" style="display: block; width: 100%; text-align: left; border: 0; background: #E8EEFF; border-radius: 12px; padding: 10px 12px; margin-top: 8px"><div style="font-size: 12px; font-weight: 700" class="muted">{{m.acctName}} · {{m.when}}</div><div style="font-size: 14px; margin-top: 2px">{{m.text}}</div></button></sc-for>
        </div>
      </div>
    </sc-if>

    <!-- ================= ADMIN: ACCOUNTS ================= -->
    <sc-if value="{{v.aAccounts}}" hint-placeholder-val="{{false}}">
      <div class="card"><div class="scroll"><div class="tbl" style="--cols: 1.8fr 1.2fr 1.3fr 0.7fr 1.1fr 1.6fr 0.6fr; --minw: 980px"><div class="tr th"><div>Account</div><div>Type</div><div>Pricing Model</div><div>Terms</div><div>Territory</div><div>Rep / Commission</div><div>Open Orders</div></div>
        <sc-for list="{{acctRows}}" as="a" hint-placeholder-count="4"><div class="tr"><div><b>{{a.name}}</b><div class="muted" style="font-size: 12px">{{a.buyer}}</div></div><div>{{a.type}}</div><div>{{a.modelName}}</div><div>{{a.terms}}</div><div>{{a.territory}}</div><div>{{a.rep}}</div><div>{{a.open}}</div></div></sc-for>
      </div></div>
      <p class="muted" style="font-size: 13px; margin: 12px 0 0">Stallings territory (MI, IN, OH, Western PA, WV, KY) is flagged for commission on every order from these accounts.</p></div>
    </sc-if>

    <!-- ================= ADMIN: PRICING ================= -->
    <sc-if value="{{v.aPricing}}" hint-placeholder-val="{{false}}">
      <div class="grid g2" style="align-items: start">
        <div class="card">
          <h2 class="h2">Enterprise Contract Prices</h2>
          <p class="muted" style="margin: 6px 0 12px; font-size: 14px">Fixed per-item prices for contract accounts. Leave blank until agreed.</p>
          <div class="scroll"><div class="tbl" style="--cols: 2fr 1fr 150px; --minw: 380px"><div class="tr th"><div>Item</div><div>MSRP</div><div>Contract Price</div></div>
            <sc-for list="{{contractRows}}" as="r" hint-placeholder-count="8"><div class="tr"><div><b>{{r.name}}</b></div><div>{{r.msrp}}</div><div style="width: 150px"><input class="inp" type="number" min="0" step="0.01" placeholder="$" value="{{r.val}}" onChange="{{r.set}}" aria-label="Contract price {{r.name}}"></div></div></sc-for>
          </div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px">
          <div class="card">

            <p class="muted" style="margin: 6px 0 12px; font-size: 14px">Discount off MSRP by total units on the order.</p>

              <div class="grid" style="grid-template-columns: 90px 1fr 1fr; gap: 10px; align-items: end; margin-bottom: 10px"><b style="padding-bottom: 12px">{{t.name}}</b><label><span class="lbl">Min Units</span><input class="inp" type="number" min="0" value="{{t.min}}" onChange="{{t.setMin}}"></label><label><span class="lbl">% Off MSRP</span><input class="inp" type="number" min="0" max="90" value="{{t.pct}}" onChange="{{t.setPct}}"></label></div>

            <div class="muted" style="font-size: 13px">{{tierPreview}}</div>

            <h2 class="h2">Terms</h2>
            <div class="grid g2" style="margin-top: 12px; gap: 10px">

            </div>

          </div>
        </div>
      </div>

    <!-- ================= ADMIN: AFFILIATES ================= -->
    <sc-if value="{{v.aAff}}" hint-placeholder-val="{{false}}">
      <div class="grid g4"><sc-for list="{{affKpis}}" as="k" hint-placeholder-count="5"><div class="card kpi"><div class="n">{{k.n}}</div><div class="l">{{k.l}}</div></div></sc-for></div>
      <div class="card" style="margin-top: 16px">
