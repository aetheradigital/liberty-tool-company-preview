<style>
body{margin:0;background:#F2F5FF;color:#071A52;font-family:Inter,system-ui,sans-serif}

.agchk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45;cursor:pointer}
.agchk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:#0A35C8}
.sobtn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.55);background:transparent;color:#FFFFFF;font-weight:700;font-size:13px;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer}
.sobtn:hover{background:rgba(255,255,255,0.12)}
/* signed-in user box in the menu */
.who{border-top:1px solid rgba(255,255,255,0.18);padding-top:14px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:#C9D6EC}
.who b{color:#FFFFFF;font-size:14px}
.who .sobtn{margin-top:10px;width:100%}
@media (max-width:640px){.tbl.stack1,.tbl.stack2{min-width:0}.tbl.stack1 .tr.th,.tbl.stack2 .tr.th{display:none}.tbl.stack1 .tr{grid-template-columns:1fr;gap:8px}.tbl.stack1 .tr>div:last-child{justify-content:flex-start!important}.tbl.stack2 .tr{grid-template-columns:1fr 1fr;gap:6px 12px}}
/* mobile header + hamburger drawer */
.mtop{display:none}
.mclose{display:none}
.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:45;background:#0A35C8;color:#FFFFFF;padding:10px 12px 10px 16px;box-shadow:0 4px 14px rgba(7,26,82,0.18)}
  .mtop img{height:34px;width:auto;display:block}
  .mtop .mt{min-width:0;flex:1;font-size:12px;line-height:1.25;color:#C9D6EC}
  .mtop .mt b{display:block;color:#FFFFFF;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hamb{width:46px;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,0.45);background:transparent;color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(86vw,320px);height:100vh;height:100dvh;z-index:56;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;padding:18px 16px 24px;box-shadow:none}
  .side.open{transform:none;box-shadow:12px 0 40px rgba(0,0,0,0.3)}
  .side .nav{flex-direction:column}
  .nv{width:100%}
  .sidemore{display:none}
  .mclose{display:inline-flex;position:absolute;top:14px;right:12px;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,0.45);background:transparent;color:#FFFFFF;align-items:center;justify-content:center;font-size:22px;line-height:1;cursor:pointer}
  .scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(7,18,40,0.5)}
  .main{padding:18px 16px 56px}
  .h1{font-size:25px}
  .toast{left:16px;right:16px;bottom:16px}
}
.vtog{display:inline-flex;padding:3px;border:1px solid #DCE3F7;border-radius:999px;background:#F4F7FF}
.vtog button{min-height:36px;padding:0 16px;border:0;border-radius:999px;background:transparent;font:inherit;font-size:13px;font-weight:700;color:#071A52;cursor:pointer}
.vtog button[aria-pressed="true"]{background:#0A35C8;color:#FFFFFF}
.calhd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}
.calnav{display:flex;align-items:center;gap:8px}
.calbtn{width:38px;height:38px;border-radius:999px;border:1px solid #DCE3F7;background:#FFFFFF;color:#071A52;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.calbtn:disabled{opacity:.35;cursor:default}
.calttl{min-width:150px;text-align:center;font-size:15px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.caldow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#4A5568;text-align:center;padding:4px 0}
.calcell{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;min-height:92px;padding:6px;border:1px solid #DCE3F7;border-radius:10px;background:#FFFFFF;text-align:left;font:inherit;color:#071A52;cursor:pointer}
.calcell:hover:not(:disabled){border-color:#0A35C8}
.calcell:disabled{background:#F4F6FA;color:#6B7486;cursor:default}
.calcell[data-out="true"]{opacity:.6}
.calcell[aria-pressed="true"]{border:2px solid #0A35C8;background:#E8EEFF;padding:5px}
.calnum{font-size:13px;font-weight:700}
.calcell[data-today="true"] .calnum{display:inline-flex;align-self:flex-start;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;border-radius:999px;background:#B31942;color:#FFFFFF}
.calev{display:block;font-size:11px;line-height:1.3;padding:2px 5px;border-radius:5px;background:#0A35C8;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calmore{font-size:11px;font-weight:600;color:#0A35C8}
.caldot{display:none;width:6px;height:6px;border-radius:999px;background:#0A35C8;margin:2px auto 0}
.calleg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:#4A5568}
.calleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chip:disabled{opacity:.45;text-decoration:line-through;cursor:default}
.attrow{display:flex;flex-wrap:wrap;gap:8px}
.attchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:34px;padding:0 4px 0 10px;border-radius:999px;border:1px solid #C9D6FF;background:#F4F7FF;font-size:13px;font-weight:600;color:#071A52}
.attnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.attx{width:28px;height:28px;border:0;border-radius:999px;background:transparent;font-size:18px;line-height:1;color:#4A5568;cursor:pointer}
.attx:hover{background:#DCE3F7}
.batt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.batt a,.batt .bf{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 10px;border-radius:10px;background:rgba(127,140,170,.16);border:1px solid rgba(127,140,170,.4);color:inherit;font-size:13px;font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.batt a:hover{background:rgba(127,140,170,.28)}
@media (max-width:640px){.calcell{min-height:48px;padding:4px;align-items:center}.calcell[aria-pressed="true"]{padding:3px}.calev,.calmore{display:none}.caldot{display:block}.calgrid{gap:3px}.caldow{font-size:10px;letter-spacing:0}.calttl{min-width:0}.attnm{max-width:150px}}
</style>

</head>
<body>
<div id="ltc-preview-bar" style="position: relative; z-index: 60; background: #0B1424; color: #FFFFFF; font: 500 13px/1.2 Inter, system-ui, sans-serif">

    <a href="/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap">← LTC Preview Portal</a>
    <span style="opacity: 0.35">|</span>
    <nav aria-label="Preview pages" style="display: flex; flex-wrap: wrap; gap: 8px 20px"><a href="/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Website</a><a href="/approvals/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Social Posting Calendar</a><a href="/partner-portal/option-2/" style="color: #FFFFFF; text-decoration: none; font-weight: 700; white-space: nowrap; border-bottom: 2px solid #B31942; padding-bottom: 2px">Partner Portal</a><a href="/affiliate-portal/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Affiliate Portal</a><a href="/sales-rep/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Sales Rep Portal</a><a href="/admin/option-2/" style="color: #B9C6DA; text-decoration: none; font-weight: 500; white-space: nowrap; ">Admin</a></nav>

<template id="tpl">

<sc-if value="{{au.isCard}}" hint-placeholder-val="{{false}}">
<div class="auth">
  <div class="aubrand">
    <img src="/assets/logo-white.png" alt="Liberty Tool Company" class="aulogo">
    <div class="aulabel">Partner Portal<span class="auaddr"> · partner.libertytoolcompany.com</span></div>
    <div class="aupitch">
      <h2>Order, track, pay and work with Liberty Tool Company in one place.</h2>
      <ul><li>Your contract or distributor pricing on every order</li><li>Tracking, invoices and claims without the phone tag</li><li>Cut sheets, price sheets and your signed agreements</li></ul>
    </div>
    <div class="aufoot">Questions? Text or call 239-744-8403 (24/7) · sales@libertytoolcompany.com</div>
  </div>
  <div class="aupane">
    <div class="aucard">

      <sc-if value="{{au.sSignin}}" hint-placeholder-val="{{true}}">
        <div class="eyebrow">Partner Portal</div>
        <h1 class="h1" style="margin-top: 6px">Sign In</h1>
        <p class="muted" style="margin: 8px 0 0; font-size: 14px; line-height: 1.5">Use the work email your invite was sent to.</p>
        <sc-if value="{{au.hasNote}}" hint-placeholder-val="{{false}}"><div class="aunote">{{au.note}}</div></sc-if>
        <div style="display: grid; gap: 12px; margin-top: 16px">
          <label><span class="lbl">Work Email</span><input class="inp" type="email" autocomplete="username" value="{{au.email}}" onChange="{{au.setEmail}}" onKeydown="{{au.onKey}}" placeholder="name@company.com"></label>
          <label><span class="lbl" style="display: flex; justify-content: space-between">Password <button type="button" class="linkbtn" style="margin: 0" onClick="{{au.togShow}}">{{au.showLbl}}</button></span><input class="inp" type="{{au.pwType}}" autocomplete="current-password" value="{{au.pw}}" onChange="{{au.setPw}}" onKeydown="{{au.onKey}}"></label>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px">
          <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px"><button type="button" class="chk" aria-pressed="{{au.remember}}" onClick="{{au.togRemember}}" aria-label="Keep me signed in"></button>Keep me signed in for {{au.rememberDays}} days</span>
          <button type="button" class="linkbtn" style="margin: 0; font-size: 14px" onClick="{{au.goForgot}}">Forgot password?</button>
        </div>
        <sc-if value="{{au.hasErr}}" hint-placeholder-val="{{false}}"><div class="auerr" role="alert">{{au.err}}</div></sc-if>
        <button type="button" class="btn red aubtn" onClick="{{au.signIn}}">Sign In</button>
        <div class="aufine">Portal address: <b>partner.libertytoolcompany.com</b>. Bookmark it on your computer and phone. New to the portal? Open the invite email from Liberty Tool Company and click <b>Accept Invite</b>. Invite links work for {{au.inviteDays}} days. After {{au.maxTries}} wrong passwords in a row, sign-in locks for {{au.lockMin}} minutes.</div>
      </sc-if>

      <sc-if value="{{au.sForgot}}" hint-placeholder-val="{{false}}">
        <div class="eyebrow">Partner Portal</div>
        <h1 class="h1" style="margin-top: 6px">Reset Your Password</h1>
        <p class="muted" style="margin: 8px 0 0; font-size: 14px; line-height: 1.5">Enter the email you sign in with. We’ll send a link to set a new password.</p>
        <label style="display: block; margin-top: 16px"><span class="lbl">Work Email</span><input class="inp" type="email" autocomplete="username" value="{{au.email}}" onChange="{{au.setEmail}}" placeholder="name@company.com"></label>
        <sc-if value="{{au.hasErr}}" hint-placeholder-val="{{false}}"><div class="auerr" role="alert">{{au.err}}</div></sc-if>
        <button type="button" class="btn red aubtn" onClick="{{au.sendReset}}">Send Reset Link</button>
        <button type="button" class="btn ghost aubtn2" onClick="{{au.goSignin}}">Back To Sign In</button>
        <div class="aufine">Reset links work once and expire after {{au.resetMin}} minutes. Asking for a new one cancels the last link. Can’t get into that inbox? Ask your Account Admin to send a reset or set a temporary password from the Team tab.</div>
      </sc-if>

      <sc-if value="{{au.sSent}}" hint-placeholder-val="{{false}}">
        <div class="auicon">✉</div>
        <h1 class="h1">Check Your Email</h1>
        <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.55">If <b>{{au.sentTo}}</b> has a portal login, a reset link is on its way. It works once, for {{au.resetMin}} minutes.</p>
        <p class="muted" style="margin: 10px 0 0; font-size: 14px; line-height: 1.5">Nothing after 5 minutes? Check spam or junk, then send it again. The newest link is the only one that works.</p>
        <button type="button" class="btn ghost aubtn" onClick="{{au.sendReset}}">Send It Again</button>
        <button type="button" class="btn ghost aubtn2" onClick="{{au.goSignin}}">Back To Sign In</button>
        <div class="authdemo"><b>Preview only</b><button type="button" class="btn sm" onClick="{{au.openResetMail}}">Open The Reset Email</button></div>
      </sc-if>

      <sc-if value="{{au.isMail}}" hint-placeholder-val="{{false}}">
        <div class="mail">
          <div class="mhead">
            <div><span>From</span><b>Liberty Tool Company &lt;portal@libertytoolcompany.com&gt;</b></div>
            <sc-if value="{{au.sMailReset}}" hint-placeholder-val="{{false}}"><div><span>To</span><b>{{au.resetEmail}}</b></div><div><span>Subject</span><b>Reset your LTC Partner Portal password</b></div></sc-if>
            <sc-if value="{{au.sMailInvite}}" hint-placeholder-val="{{false}}"><div><span>To</span><b>{{au.inv.email}}</b></div><div><span>Subject</span><b>{{au.inv.by}} invited you to the LTC Partner Portal</b></div></sc-if>
          </div>
          <div class="mbar"><img src="/assets/logo-white.png" alt="Liberty Tool Company"></div>
          <div class="mbody">
            <sc-if value="{{au.sMailReset}}" hint-placeholder-val="{{false}}">
              <p>Hi {{au.resetName}},</p>
              <p>We got a request to reset the password for your LTC Partner Portal login.</p>
              <button type="button" class="btn red" onClick="{{au.openReset}}">Reset My Password</button>
              <p class="muted">This link works once and expires in {{au.resetMin}} minutes, at {{au.resetExpires}}.</p>
              <p class="muted">Didn’t ask for this? Ignore this email. Your password won’t change.</p>
            </sc-if>
            <sc-if value="{{au.sMailInvite}}" hint-placeholder-val="{{false}}">
              <p>Hi {{au.inv.first}},</p>
              <p><b>{{au.inv.by}}</b> added you to <b>{{au.inv.co}}</b>’s LTC Partner Portal as <b>{{au.inv.role}}</b> for <b>{{au.inv.loc}}</b>. Use it to order Tape Caddies and LTC trowels, track shipments and reach the LTC team.</p>
              <button type="button" class="btn red" onClick="{{au.acceptInvite}}">Accept Invite &amp; Set Password</button>
              <p class="muted">This link works once and expires in {{au.inviteDays}} days, on {{au.inv.expires}}. After that, ask {{au.inv.by}} to resend it.</p>
              <p class="muted">After you set your password, sign in any time at <b>partner.libertytoolcompany.com</b>.</p>
            </sc-if>
            <p class="muted" style="font-size: 12px; border-top: 1px solid #DCE3F7; padding-top: 10px">partner.libertytoolcompany.com · Liberty Tool Company · 712 W. Cienega Ave, Unit A, San Dimas, CA 91773 · 239-744-8403</p>
          </div>
        </div>
        <button type="button" class="btn ghost aubtn2" onClick="{{au.goSignin}}">Back To Sign In</button>
      </sc-if>

      <sc-if value="{{au.sReset}}" hint-placeholder-val="{{false}}">
        <div class="eyebrow">Partner Portal</div>
        <h1 class="h1" style="margin-top: 6px">Choose A New Password</h1>
        <p class="muted" style="margin: 8px 0 0; font-size: 14px">For {{au.resetEmail}}</p>
        <div style="display: grid; gap: 12px; margin-top: 16px">
          <label><span class="lbl">New Password</span><input class="inp" type="password" autocomplete="new-password" value="{{au.np}}" onChange="{{au.setNp}}"></label>
          <label><span class="lbl">Confirm New Password</span><input class="inp" type="password" autocomplete="new-password" value="{{au.np2}}" onChange="{{au.setNp2}}"></label>
        </div>
        <div class="aurules"><sc-for list="{{au.rules}}" as="c" hint-placeholder-count="5"><span style="color: {{c.fg}}">{{c.mark}} {{c.t}}</span></sc-for></div>
        <sc-if value="{{au.hasErr}}" hint-placeholder-val="{{false}}"><div class="auerr" role="alert">{{au.err}}</div></sc-if>
        <button type="button" class="btn red aubtn" onClick="{{au.saveReset}}">Save New Password</button>
        <div class="aufine">Saving also clears any lock on your login. You’ll sign in with the new password next.</div>
      </sc-if>

      <sc-if value="{{au.sInvite}}" hint-placeholder-val="{{false}}">
        <div class="eyebrow">Welcome To {{au.inv.co}}</div>
        <h1 class="h1" style="margin-top: 6px">Set Up Your Login</h1>
        <p class="muted" style="margin: 8px 0 0; font-size: 14px; line-height: 1.5">{{au.inv.role}} · {{au.inv.loc}}. Invited by {{au.inv.by}}.</p>
        <div style="display: grid; gap: 12px; margin-top: 16px">
          <label><span class="lbl">Your Name *</span><input class="inp" autocomplete="name" value="{{au.name}}" onChange="{{au.setName}}"></label>
          <div><span class="lbl">Email (Your Sign-In)</span><div class="aulocked">{{au.inv.email}}</div></div>
          <label><span class="lbl">Mobile For Texts (Optional)</span><input class="inp" type="tel" autocomplete="tel" value="{{au.phone}}" onChange="{{au.setPhone}}" placeholder="(555) 555-0100"></label>
          <label><span class="lbl">Create Password *</span><input class="inp" type="password" autocomplete="new-password" value="{{au.np}}" onChange="{{au.setNp}}"></label>
          <label><span class="lbl">Confirm Password *</span><input class="inp" type="password" autocomplete="new-password" value="{{au.np2}}" onChange="{{au.setNp2}}"></label>
        </div>
        <div class="aurules"><sc-for list="{{au.rules}}" as="c" hint-placeholder-count="5"><span style="color: {{c.fg}}">{{c.mark}} {{c.t}}</span></sc-for></div>
        <sc-if value="{{au.hasErr}}" hint-placeholder-val="{{false}}"><div class="auerr" role="alert">{{au.err}}</div></sc-if>
        <button type="button" class="btn red aubtn" onClick="{{au.saveInvite}}">Create My Login</button>
        <div class="aufine">Your email can’t be changed here. If it’s wrong, ask {{au.inv.by}} to send a new invite to the right address.</div>
      </sc-if>

      <sc-if value="{{au.sExpired}}" hint-placeholder-val="{{false}}">
        <div class="auicon" style="background: #FDECEF; color: #B31942">!</div>
        <h1 class="h1">This Link Has Expired</h1>
        <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.55">Invite links work for {{au.inviteDays}} days and reset links for {{au.resetMin}} minutes. Each link works once, and a newer link replaces an older one.</p>
        <p class="muted" style="margin: 10px 0 0; font-size: 14px; line-height: 1.5">Ask {{au.expBy}} to resend your invite from the Team tab, or request a new one below.</p>
        <button type="button" class="btn red aubtn" onClick="{{au.askNewInvite}}">Request A New Invite</button>
        <button type="button" class="btn ghost aubtn2" onClick="{{au.goSignin}}">Back To Sign In</button>
      </sc-if>

      <sc-if value="{{au.sLocked}}" hint-placeholder-val="{{false}}">
        <div class="auicon" style="background: #FDECEF; color: #B31942">🔒</div>
        <h1 class="h1">Login Locked For {{au.lockMin}} Minutes</h1>
        <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.55">There were {{au.maxTries}} wrong passwords in a row, so sign-in is paused until <b>{{au.lockUntil}}</b> to protect your account.</p>
        <p class="muted" style="margin: 10px 0 0; font-size: 14px; line-height: 1.5">Can’t wait? Reset your password now, which clears the lock, or ask your Account Admin to unlock you from the Team tab.</p>
        <button type="button" class="btn red aubtn" onClick="{{au.resetFromLock}}">Reset My Password</button>
        <button type="button" class="btn ghost aubtn2" onClick="{{au.goSignin}}">Back To Sign In</button>
        <div class="authdemo"><b>Preview only</b><button type="button" class="btn sm" onClick="{{au.skipLock}}">Skip The Wait</button></div>
      </sc-if>

      <sc-if value="{{au.sSetpw}}" hint-placeholder-val="{{false}}">
        <div class="eyebrow">One More Step</div>
        <h1 class="h1" style="margin-top: 6px">Choose Your Own Password</h1>
        <p class="muted" style="margin: 8px 0 0; font-size: 14px; line-height: 1.5">{{au.tempNote}}</p>
        <div style="display: grid; gap: 12px; margin-top: 16px">
          <label><span class="lbl">New Password</span><input class="inp" type="password" autocomplete="new-password" value="{{au.np}}" onChange="{{au.setNp}}"></label>
          <label><span class="lbl">Confirm New Password</span><input class="inp" type="password" autocomplete="new-password" value="{{au.np2}}" onChange="{{au.setNp2}}"></label>
        </div>
        <div class="aurules"><sc-for list="{{au.rules}}" as="c" hint-placeholder-count="5"><span style="color: {{c.fg}}">{{c.mark}} {{c.t}}</span></sc-for></div>
        <sc-if value="{{au.hasErr}}" hint-placeholder-val="{{false}}"><div class="auerr" role="alert">{{au.err}}</div></sc-if>
        <button type="button" class="btn red aubtn" onClick="{{au.saveSetpw}}">Save &amp; Continue</button>
        <button type="button" class="btn ghost aubtn2" onClick="{{au.signOut}}">Sign Out</button>
      </sc-if>
    </div>

    <sc-if value="{{au.sSignin}}" hint-placeholder-val="{{true}}">
      <div class="authdemo aucard" style="margin-top: 14px">
        <div><b>Preview only — demo sign-ins.</b> Any email and password will sign you in for this mockup. Pick a role below, or type a demo email to see that person’s view.</div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px"><sc-for list="{{au.demoUsers}}" as="u" hint-placeholder-count="6"><button type="button" class="chip" onClick="{{u.go}}">{{u.label}}</button></sc-for></div>

        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px"><sc-for list="{{cutList}}" as="c" hint-placeholder-count="8"><button type="button" class="chip" onClick="{{c.open}}">{{c.name}}</button></sc-for></div>
      </div>
      <div class="card">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center">
          <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{folderChips}}" as="f" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{f.on}}" onClick="{{f.pick}}">{{f.label}}</button></sc-for></div>
          <label class="btn" style="cursor: pointer; position: relative">Upload File<input type="file" onChange="{{uploadFile}}" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
        </div>
        <div class="scroll" style="margin-top: 12px"><div class="tbl" style="--cols: {{fileCols}}; --minw: 560px"><div class="tr th"><div>File</div><sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div>Account</div></sc-if><div>Folder</div><div>Added</div><div>By</div></div>
          <sc-for list="{{fileRows}}" as="f" hint-placeholder-count="6"><div class="tr"><div><b>{{f.name}}</b></div><sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div>{{f.acctName}}</div></sc-if><div>{{f.folder}}</div><div>{{f.date}}</div><div>{{f.by}}</div></div></sc-for>
        </div></div>
        <div class="muted" style="font-size: 12px; margin-top: 10px">Uploads go to the folder selected above ({{uploadFolder}}). Mockup only: files are listed, not stored.</div>
      </div>
    </sc-if>

    <!-- ================= MESSAGES ================= -->
    <sc-if value="{{v.messages}}" hint-placeholder-val="{{false}}">
      <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px"><sc-for list="{{threadChips}}" as="t" hint-placeholder-count="2"><button type="button" class="chip" aria-pressed="{{t.on}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div></sc-if>
      <div class="card" style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{thread}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; justify-content: {{m.side}}"><div class="bub" style="background: {{m.bg}}; color: {{m.fg}}"><div style="font-size: 12px; font-weight: 700; opacity: 0.8">{{m.from}} · {{m.when}}</div><sc-if value="{{m.hasText}}" hint-placeholder-val="{{true}}"><div style="margin-top: 4px">{{m.text}}</div></sc-if><sc-if value="{{m.hasAtt}}" hint-placeholder-val="{{false}}"><div class="batt"><sc-for list="{{m.att}}" as="a" hint-placeholder-count="1"><sc-if value="{{a.hasUrl}}" hint-placeholder-val="{{false}}"><a href="{{a.url}}" target="_blank" rel="noopener" download="{{a.name}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><span>{{a.name}}</span><span style="opacity: 0.75">{{a.size}}</span></a></sc-if><sc-if value="{{a.noUrl}}" hint-placeholder-val="{{true}}"><span class="bf" title="Mockup: attachments open only in the session they were sent from"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><span>{{a.name}}</span><span style="opacity: 0.75">{{a.size}}</span></span></sc-if></sc-for></div></sc-if></div></div>
        </sc-for>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px"><sc-for list="{{quickReplies}}" as="q" hint-placeholder-count="3"><button type="button" class="chip" onClick="{{q.use}}">{{q.t}}</button></sc-for></div>
        <sc-if value="{{hasAtt}}" hint-placeholder-val="{{false}}"><div class="attrow" aria-label="Attached to this message"><sc-for list="{{att}}" as="f" hint-placeholder-count="1"><span class="attchip"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><span class="attnm">{{f.name}}</span><span class="muted" style="font-size: 12px; font-weight: 500">{{f.size}}</span><button type="button" class="attx" onClick="{{f.remove}}" aria-label="Remove {{f.name}}">×</button></span></sc-for></div></sc-if>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end">
          <label style="flex: 1 1 260px"><span class="lbl">Message</span><textarea class="inp" placeholder="Type a message" onChange="{{setDraft}}">{{draft}}</textarea></label>
          <div style="display: flex; gap: 8px">
            <label class="btn ghost" style="cursor: pointer; position: relative"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg> Attach<input type="file" multiple onChange="{{addAtt}}" aria-label="Attach documents to this message" style="position: absolute; width: 1px; height: 1px; opacity: 0"></label>
            <button type="button" class="btn" onClick="{{send}}">Send</button>
          </div>
        </div>
        <div class="muted" style="font-size: 12px">Attach POs, quotes, photos, spec sheets or any document. Up to 5 files, 25 MB each.</div>
      </div>
    </sc-if>

    <!-- ================= BOOK TIME ================= -->
    <sc-if value="{{v.book}}" hint-placeholder-val="{{false}}">
      <div class="card">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px"><h2 class="h2">What Do You Need?</h2><div class="vtog" role="group" aria-label="Show days as"><button type="button" aria-pressed="{{calListOn}}" onClick="{{calList}}">List</button><button type="button" aria-pressed="{{calOn}}" onClick="{{calCal}}">Calendar</button></div></div>
        <div class="grid g4" style="margin-top: 12px"><sc-for list="{{bookTypes}}" as="t" hint-placeholder-count="4"><button type="button" class="opt" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 96px"><span class="h3" style="color: #0A35C8">{{t.name}}</span><span class="muted" style="font-size: 13px">{{t.desc}}</span></button></sc-for></div>
        <sc-if value="{{calListOnB}}" hint-placeholder-val="{{true}}">
        <h3 class="h3" style="margin-top: 20px">Pick A Day</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px"><sc-for list="{{bookDays}}" as="d" hint-placeholder-count="6"><button type="button" class="chip" aria-pressed="{{d.on}}" onClick="{{d.pick}}">{{d.label}}</button></sc-for></div>
        </sc-if>
        <sc-if value="{{calOnB}}" hint-placeholder-val="{{false}}">
        <div class="calhd"><h3 class="h3">Pick A Day</h3><div class="calnav"><button type="button" class="calbtn" onClick="{{cal.prev}}" disabled="{{cal.noPrev}}" aria-label="Previous month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button><b class="calttl">{{cal.title}}</b><button type="button" class="calbtn" onClick="{{cal.next}}" disabled="{{cal.noNext}}" aria-label="Next month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button></div></div>
        <div class="calgrid"><sc-for list="{{cal.dow}}" as="w" hint-placeholder-count="7"><div class="caldow">{{w}}</div></sc-for><sc-for list="{{cal.cells}}" as="c" hint-placeholder-count="35"><button type="button" class="calcell" aria-pressed="{{c.on}}" disabled="{{c.off}}" data-out="{{c.out}}" data-today="{{c.today}}" onClick="{{c.pick}}" aria-label="{{c.aria}}"><span class="calnum">{{c.num}}</span><sc-for list="{{c.items}}" as="it" hint-placeholder-count="1"><span class="calev" title="{{it}}">{{it}}</span></sc-for><sc-if value="{{c.more}}" hint-placeholder-val="{{false}}"><span class="calmore">{{c.moreLabel}}</span></sc-if><sc-if value="{{c.has}}" hint-placeholder-val="{{false}}"><span class="caldot"></span></sc-if></button></sc-for></div>
        <div class="calleg"><span><i style="background: #0A35C8"></i>{{cal.legendMine}}</span><span><i style="background: #B31942"></i>Today</span><span><i style="background: #F4F6FA; border: 1px solid #DCE3F7"></i>Weekends And Past Days Unavailable</span></div>
        </sc-if>
        <h3 class="h3" style="margin-top: 18px">Pick A Time (Pacific)</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px"><sc-for list="{{bookTimes}}" as="d" hint-placeholder-count="6"><button type="button" class="chip" aria-pressed="{{d.on}}" disabled="{{d.off}}" onClick="{{d.pick}}" aria-label="{{d.aria}}">{{d.label}}</button></sc-for></div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 20px"><button type="button" class="btn red" onClick="{{confirmBook}}">Book It</button><span class="muted" style="font-size: 14px">{{bookHint}}</span></div>
      </div>
      <div class="card" style="margin-top: 16px">
        <h3 class="h3">Upcoming</h3>
        <sc-for list="{{bookRows}}" as="b" hint-placeholder-count="2"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #DCE3F7; font-size: 14px"><span><b>{{b.type}}</b> · {{b.acctName}}</span><span>{{b.when}}</span></div></sc-for>
        <sc-if value="{{noBooks}}" hint-placeholder-val="{{false}}"><p class="muted">Nothing booked yet.</p></sc-if>
      </div>
    </sc-if>

    <!-- ================= PORTAL: TEAM ================= -->
    <sc-if value="{{v.team}}" hint-placeholder-val="{{false}}">
      <div class="card">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center"><div><h2 class="h2">Your Team</h2><div class="muted" style="margin-top: 4px">Everyone at {{acct.name}} who can sign in. Store users only see their own store.</div></div><span style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><sc-if value="{{lc.canImport}}" hint-placeholder-val="{{true}}"><button type="button" class="btn ghost sm" onClick="{{goImport}}">Import Stores &amp; Managers (CSV)</button></sc-if><span class="chip">{{tm.count}} Logins</span></span></div>
        <div class="scroll" style="margin-top: 10px"><div class="tbl stack1" style="--cols: minmax(0, 1.5fr) minmax(0, 1.5fr) minmax(0, 1.2fr) 290px; --minw: 900px"><div class="tr th"><div>Name</div><div>Role &amp; Access</div><div>Status &amp; Last Sign-In</div><div style="text-align: right">Login &amp; Password</div></div>
          <sc-for list="{{tm.rows}}" as="u" hint-placeholder-count="4"><div class="tr"><div><b>{{u.name}}</b><div class="muted" style="font-size: 12px; overflow-wrap: anywhere">{{u.email}}</div></div><div><b style="font-weight: 600">{{u.role}}</b> · {{u.locName}}<div class="muted" style="font-size: 12px; margin-top: 2px">{{u.can}}</div></div><div><span class="st" style="background: {{u.sbg}}; color: {{u.sfg}}">{{u.status}}</span><div class="muted" style="font-size: 12px; margin-top: 4px">{{u.last}}</div></div><div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end"><sc-for list="{{u.acts}}" as="b" hint-placeholder-count="2"><button type="button" class="btn ghost sm" onClick="{{b.go}}">{{b.label}}</button></sc-for><sc-if value="{{u.canEdit}}" hint-placeholder-val="{{true}}"><button type="button" class="btn ghost sm" onClick="{{u.toggle}}">{{u.toggleLabel}}</button></sc-if><sc-if value="{{u.hasNote}}" hint-placeholder-val="{{false}}"><span class="muted" style="font-size: 12px; text-align: right">{{u.note}}</span></sc-if></div></div></sc-for>
        </div></div>
      </div>
      <sc-if value="{{mm.hasTemp}}" hint-placeholder-val="{{false}}"><div class="card" style="margin-top: 16px; border: 2px solid #0A35C8">
        <div class="eyebrow">Temporary Password</div><h3 class="h3" style="margin-top: 4px">For {{mm.tpw.name}}</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px"><code style="font-size: 22px; font-weight: 800; letter-spacing: 0.06em; padding: 10px 14px; background: #F2F5FF; border: 1px solid #DCE3F7; border-radius: 12px">{{mm.tpw.pw}}</code><button type="button" class="btn sm" onClick="{{mm.copyTemp}}">Copy</button><button type="button" class="btn ghost sm" onClick="{{mm.doneTemp}}">Done</button></div>
        <p class="muted" style="font-size: 13px; line-height: 1.55; margin: 12px 0 0">Give it to {{mm.tpw.name}} by phone or in person, not by email. It works once and expires in {{au.tempHours}} hours. They sign in with {{mm.tpw.email}} and this password, then choose their own. You’ll only see it this once.</p>
      </div></sc-if>
      <div class="card" style="margin-top: 16px">
        <h3 class="h3">Invite A Team Member</h3>
        <p class="muted" style="margin: 6px 0 0; font-size: 14px">They get an email to set a password. You can change access or turn it off anytime.</p>
        <div class="grid g4" style="margin-top: 12px; gap: 10px">
          <label><span class="lbl">Name *</span><input class="inp" value="{{tm.f.name}}" onChange="{{tm.setName}}" placeholder="First and last name"></label>
          <label><span class="lbl">Email *</span><input class="inp" type="email" value="{{tm.f.email}}" onChange="{{tm.setEmail}}" placeholder="name@company.com"></label>

        </div>
        <div class="lbl" style="margin: 14px 0 6px">What They Can Do</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{tm.perms}}" as="p" hint-placeholder-count="5"><button type="button" class="chip" aria-pressed="{{p.on}}" onClick="{{p.toggle}}">{{p.label}}</button></sc-for></div>
        <button type="button" class="btn red" style="margin-top: 14px" onClick="{{tm.invite}}">Send Invite</button>

      <div class="card" style="margin-top: 16px">

        <p class="muted" style="margin: 6px 0 0; font-size: 14px">As Account Admin you can resend invites, send reset links, set temporary passwords and unlock anyone on your team except other Account Admins. LTC handles Account Admin logins: 239-744-8403.</p>
        <div class="grid g3" style="margin-top: 12px; gap: 10px"><sc-for list="{{mm.policy}}" as="p" hint-placeholder-count="6"><div style="padding: 12px 14px; border: 1px solid #DCE3F7; border-radius: 12px; background: #F7F9FF"><b style="font-size: 14px">{{p.k}}</b><div class="muted" style="font-size: 13px; line-height: 1.5; margin-top: 4px">{{p.v}}</div></div></sc-for></div>
      </div>

    <!-- ================= ADDRESSES (portal + admin) ================= -->
    <sc-if value="{{v.addr}}" hint-placeholder-val="{{false}}">
      <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div class="card" style="margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end"><label style="flex: 0 1 360px"><span class="lbl">Account</span><select class="inp" value="{{acctKey}}" onChange="{{ad.pickAcct}}"><sc-for list="{{acctOpts}}" as="o" hint-placeholder-count="4"><option value="{{o.v}}">{{o.label}}</option></sc-for></select></label><span class="muted" style="font-size: 13px; flex: 1 1 300px">LTC can edit any account’s addresses. Partners edit their own from the portal.</span></div></sc-if>

            </div>
          </sc-for>
        </div>

if></div><div style="font-size: 13px">{{a.billTxt}}<div class="muted" style="font-size: 12px">{{a.taxTxt}}</div><div class="muted" style="font-size: 12px">{{a.locTxt}}</div></div><div style="text-align: right"><button type="button" class="btn ghost sm" onClick="{{a.addr}}">Addresses</button></div></div></sc-for>

        </div></div>

  { t: 'p', x: 'The ceiling includes all mandatory reseller-imposed fees attributable to the covered unit but excludes legally permitted separately stated government taxes and reasonable actual delivery charges. It does not permit fictitious shipping charges or misleading fee disclosures. Separately elected installation or unrelated services are excluded only when genuinely optional and separately priced. Bundles subject to the ceiling require a written, objectively stated covered-product allocation agreed by both parties; absent that allocation, no bundle-specific ceiling is imposed. An activated ceiling may be changed only by a writing signed by both parties. It expires on the listed end date unless renewed. An unlawful ceiling is inapplicable in the affected jurisdiction; other lawful terms remain effective.' },
  { t: 's', x: '4. Advertising administration and information' },
  { t: 'p', x: 'Reseller shall maintain an accurate notice contact and provide factual information reasonably necessary to investigate counterfeit goods, false advertising, misuse of marks, or a ceiling breach. Any request is limited to relevant records and excludes unrelated customer information and future pricing plans. Reseller shall not coordinate its prices with competing resellers. Neither party shall use this Agreement to exchange competitors’ confidential information or to implement a collective boycott. MAP supply decisions remain solely under Part I, not the contractual default procedure below.' },
  { t: 'h', x: 'Part IV — Confidentiality, Termination, and Liability' },
  { t: 's', x: '1. Confidentiality and intellectual property' },
  { t: 'p', x: 'Each party shall protect the other’s nonpublic business, technical, customer, and financial information using reasonable care, use it only for the authorized relationship, and disclose it only to personnel or professional advisers with a need to know and confidentiality obligations. Information already lawfully known, public without breach, independently developed, or lawfully obtained from a third party is excluded. Legally compelled disclosure is permitted, with prior notice where lawful. These obligations continue for three years after termination; trade secrets remain protected while legally qualifying. Public MAP notices and public product prices are not confidential. Nothing restricts reports to regulators or legally protected disclosures. Liberty retains ownership of its marks, designs, and materials. On termination, each party shall return or destroy confidential information on request, except legally required records and protected archival backups.' },
  { t: 's', x: '2. Term, breach, and termination' },
  { t: 'p', x: 'This Agreement continues until terminated. Either party may terminate on thirty calendar days’ written notice, subject to mandatory dealer laws and any longer controlling contractual notice. For a material breach of Part II, the nonbreaching party may give notice describing the breach and allow ten business days to cure before termination. Subject to law, immediate suspension or termination is permitted for fraud, counterfeit products, unlawful conduct, intentional brand misuse, or a material safety threat. Repeated uncured ceiling violations may support termination only where the ceiling is lawfully activated. Part I does not constitute a breach of Part II.' },
  { t: 'p', x: 'Termination does not cancel accepted purchase orders, discharge accrued payment obligations, or forfeit earned compensation. Purchase orders, returns, inventory repurchases, and lawful sell-through are governed by existing sales terms and mandatory law. Any remaining genuine inventory may be accurately identified by Liberty’s marks as permitted by applicable law, without implying continuing authorization. Contractual confidentiality, accrued claims, liability provisions, and dispute provisions survive to the extent applicable. The ceiling ends when this Agreement ends unless a separately signed lawful sell-through arrangement states otherwise.' },
  { t: 's', x: '3. Third-party claims and indemnification' },
  { t: 'p', x: 'Each party shall defend and indemnify the other against third-party claims, reasonable defense costs, and resulting judgments to the extent caused by its negligence, willful misconduct, violation of law, or material breach of Part II. Reseller’s obligation includes its unauthorized product alterations, unsupported representations, and misuse of Liberty’s marks; Liberty’s obligation includes product defects attributable to Liberty and infringement by Liberty-supplied unmodified materials used as authorized. Neither party indemnifies the other for the other’s own fault. The claimant shall give prompt notice, allow defense with reasonably acceptable counsel, and cooperate at the defending party’s expense. No settlement may admit fault, impose nonmonetary obligations, or fail to release the indemnified party without its written consent, not unreasonably withheld.' },
  { t: 's', x: '4. Limitation of liability; preserved rights' },
  { t: 'p', x: 'To the fullest extent permitted by law, neither party is liable to the other for lost profits or indirect, consequential, incidental, special, or punitive damages arising under Part II. Each party’s aggregate direct liability under Part II shall not exceed the greater of $10,000 or the amounts paid or payable by Reseller to Liberty for products during the twelve months before the event. These exclusions and cap do not apply to accrued payment obligations, fraud, willful misconduct, gross negligence, confidentiality breaches, infringement or misuse of intellectual property, third-party indemnity obligations, bodily injury, property damage, or liability and remedies that law prohibits limiting, including nonwaivable antitrust and consumer-protection remedies. This Agreement does not limit any end customer’s statutory rights.' },
  { t: 'h', x: 'Part V — General Terms and Execution' },
  { t: 's', x: '1. Notices, force majeure, and written changes' },
  { t: 'p', x: 'Contract notices must be sent to the addresses or emails above by confirmed email delivery, tracked courier, or certified mail. Notice is effective upon documented receipt; an email bounce is not delivery. Each party shall notify the other of contact changes. A party affected by events beyond its reasonable control shall promptly notify the other and use reasonable mitigation efforts; performance is excused only to the extent and duration actually prevented. This does not excuse accrued payment obligations, confidentiality, or legal compliance. A disruption lasting more than thirty days permits termination of affected unperformed obligations on written notice, subject to applicable law and existing orders. Amendments to Part II require both parties’ written signatures; unilateral Part I updates follow Part I only.' },
  { t: 's', x: '2. Dispute resolution, governing law, and venue' },
  { t: 'p', x: 'The parties shall first attempt good-faith resolution through designated senior representatives for fifteen business days after written dispute notice. If unresolved, they shall attempt nonbinding mediation with a mutually selected mediator within thirty additional days and share mediator fees equally. If no mediator is agreed within ten business days or mediation fails, either party may pursue litigation. These steps do not prevent urgent protective relief, toll filing deadlines, restrict regulator communications, or limit nonwaivable rights. No mandatory arbitration is created.' },
  { t: 'p', x: 'This Agreement is governed by the laws of the State of California, without regard to its conflict-of-laws rules. Agreed court venue: the state and federal courts located in California, county as set by Liberty before execution. Venue applies only to the extent legally enforceable, including federal subject-matter jurisdiction. Mandatory federal and affected state or national competition, consumer, and dealer-protection law controls regardless of this choice.' },
  { t: 's', x: '3. Integration, precedence, assignment, and severability' },
  { t: 'p', x: 'Part II and the separately activated ceiling portion of Schedule A constitute the entire agreement concerning their limited subject matter, replacing prior discussions on that subject only. Existing supply, payment, warranty, returns, and reseller agreements remain in effect unless specifically amended in a writing signed by both parties. No term silently overrides an existing conflicting agreement; an express signed amendment is required. Part I is a separate unilateral notice and is not incorporated as a binding promise. No oral representation modifies Part II.' },
  { t: 'p', x: 'Neither party may assign Part II without the other’s prior written consent, not unreasonably withheld, except to a successor acquiring substantially all of the relevant business and assuming the obligations, with written notice. No delay in enforcement waives a right; a waiver must be written and applies only to the stated instance. If a provision is unenforceable, it is severed to the extent necessary without expanding any price restriction; the remaining lawful provisions continue. There are no third-party beneficiaries except expressly indemnified parties. Obligations intended by their terms to survive do so. Electronic signatures and counterparts are effective as originals to the extent permitted by law.' },
  { t: 's', x: '4. Execution of binding business terms' },
